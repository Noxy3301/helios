---
# CPU sampling wrapper: run BenchBase and capture CPU usage from all nodes.

- hosts: mysql
  gather_facts: false
  # The sweep plays that follow do not run on these hosts, so a failed gate here
  # has to stop the whole playbook rather than just drop the host.
  any_errors_fatal: true
  tasks:
    - name: "Gate: unique_checks=1 on every MySQL before the sweep"
      # Measured connections must validate UNIQUE indexes: the load-phase
      # relaxation is per-session and must never reach the sweep. It runs
      # before any sampler starts, so a failure leaves nothing behind.
      shell: |
        val=$(~/helios/build/runtime_output_directory/mysql \
          -u root --protocol=TCP -h 127.0.0.1 -P 3307 \
          -N -B -e "SELECT @@global.unique_checks")
        if [ "$val" != "1" ]; then
          echo "GATE_FAIL: unique_checks=$val on {{ inventory_hostname }}, expected 1" >&2
          exit 1
        fi
      args:
        executable: /bin/bash

- hosts: lineairdb:mysql:benchbase
  gather_facts: false
  vars:
    sample_interval: 1
    softnet_interval: 1
    interrupt_interval: 5
    run_id: "run"
    sample_dir: /tmp/metrics
    enable_perf: false
    perf_freq: 99
    # perf COUNTING mode (IPC / LLC), distinct from enable_perf's perf record.
    # Default false so the sweep path is behaviourally identical when unused.
    perf_stat: false
    perf_stat_interval_ms: 10000
    # Commit durability contract for the sweep; required for the lineairdb engine
    helios_durability: ""
  tasks:
    # A storage host that drops out before or inside the durability gate has to
    # stop the run; the samplers below keep the ordinary per-host semantics.
    - name: Prepare the run and reconcile the durability contract
      any_errors_fatal: true
      block:
        - name: Ensure sysstat installed
          become: yes
          tags: [privileged]
          apt:
            name: sysstat
            state: present
            update_cache: yes

        - name: Read CPU count
          command: nproc
          register: cpu_count_cmd
          changed_when: false

        - name: Set CPU count fact
          set_fact:
            cpu_count: "{{ cpu_count_cmd.stdout | int }}"

        - name: Build machine spec string (for metadata)
          set_fact:
            machine_spec: >-
              {%- set roles = ['lineairdb', 'mysql', 'benchbase'] -%}
              {%- set parts = [] -%}
              {%- for role in roles -%}
                {%- set hosts = groups.get(role, []) -%}
                {%- if hosts | length > 0 -%}
                  {%- set cpus = hosts | map('extract', hostvars, 'cpu_count') | list -%}
                  {%- set uniq = cpus | select('defined') | map('int') | unique | list -%}
                  {%- set cpu = ((uniq | length) > 0) | ternary(uniq[0], 'unknown') -%}
                  {%- set _ = parts.append(role ~ '-' ~ cpu ~ 'x' ~ (hosts | length)) -%}
                {%- endif -%}
              {%- endfor -%}
              {{ parts | join('_') }}

        - name: Set result directory
          set_fact:
            result_dir: "{{ playbook_dir }}/result/{{ run_id }}/{{ machine_spec }}"

        - name: Ensure the result directory exists on the controller
          # copy cannot create parent directories
          run_once: true
          delegate_to: localhost
          file:
            path: "{{ result_dir }}"
            state: directory

        - name: Write run metadata
          run_once: true
          delegate_to: localhost
          copy:
            dest: "{{ result_dir }}/meta.txt"
            content: |
              run_id={{ run_id }}
              machine_spec={{ machine_spec }}
              timestamp={{ lookup('pipe', 'date -Iseconds') }}

        # The load may run under a relaxed contract; the sweep never does.
        # Reconciling returns only once every write acknowledged under the load
        # contract is durable, so it runs before the samplers start.
        - name: Put the storage server in the measured durability contract
          when: inventory_hostname in groups.get('lineairdb', [])
          block:
            - name: "Gate: the measured durability contract is declared"
              assert:
                that: helios_durability in ['volatile', 'async', 'sync']
                fail_msg: >-
                  measure_usage.yml needs helios_durability=<volatile|async|sync>:
                  the sweep must not inherit whatever contract the load left behind
                quiet: true

            - name: Reconcile the storage server with the measured contract
              shell: |
                set -euo pipefail
                measured="{{ helios_durability }}"
                declared_load="{{ helios_load_durability | default(helios_durability) }}"
                log=$(ls -t ~/helios/lineairdb_logs/lineairdb_server_*.log 2>/dev/null \
                      | head -n1 || true)
                if [ -z "$log" ]; then
                  echo "SWITCH_FAIL: no server log under ~/helios/lineairdb_logs" >&2
                  exit 1
                fi
                # What the server started under: the load always precedes any switch
                startup_contract() {
                  local first
                  first=$(grep -hoE 'Commit durability: [a-z]+' "$log" | head -n1 || true)
                  printf '%s' "${first##* }"
                }
                # The policy in force: the last one the server published, else the
                # startup contract. A failed barrier still published its policy.
                policy_in_force() {
                  local last
                  last=$(grep -h 'SetCommitDurability .*effective=' "$log" \
                         | grep -oE 'effective=[A-Z]+' | tail -n1 || true)
                  if [ -z "$last" ]; then
                    startup_contract
                    return
                  fi
                  printf '%s' "${last#effective=}" | tr 'A-Z' 'a-z'
                }
                # Apparent size: wal.log is preallocated, so this stays at the
                # initial capacity until the log outgrows it.
                wal_file_bytes() {
                  local total
                  total=$(du -Lbc ~/helios/lineairdb_logs/wal*.log 2>/dev/null \
                          | tail -n1 | cut -f1 || true)
                  echo "${total:-0}"
                }
                if [ ! -x ~/helios/build/server/lineairdb-ctl ]; then
                  echo "SWITCH_FAIL: ~/helios/build/server/lineairdb-ctl is missing" >&2
                  exit 1
                fi
                if [ ! -r /tmp/lineairdb_server.pid ]; then
                  echo "SWITCH_FAIL: /tmp/lineairdb_server.pid is missing" >&2
                  exit 1
                fi
                pid=$(cat /tmp/lineairdb_server.pid)
                # The kernel truncates the process name to 15 characters
                if [ ! -r "/proc/$pid/comm" ] || \
                   [ "$(cat "/proc/$pid/comm")" != lineairdb-serve ]; then
                  echo "SWITCH_FAIL: pid $pid is not a running lineairdb-server" >&2
                  exit 1
                fi
                if ! ss -ltn | grep -q ':9999[[:space:]]'; then
                  echo "SWITCH_FAIL: nothing is listening on port 9999" >&2
                  exit 1
                fi
                startup=$(startup_contract)
                if [ -z "$startup" ]; then
                  echo "SWITCH_FAIL: cannot read the startup contract from $log" >&2
                  exit 1
                fi
                mode_before=$(policy_in_force)
                # The load ran under the startup contract whatever happened after, so a
                # failed barrier can be retried by re-running this play.
                if [ "$startup" != "$declared_load" ]; then
                  echo "SWITCH_FAIL: the load ran under $startup, not the declared $declared_load" >&2
                  exit 1
                fi
                rss_before=$(awk '/^VmRSS:/{print $2}' "/proc/$pid/status" || true)
                wal_before=$(wal_file_bytes)
                started=$(date +%s.%N)
                if [ "$measured" = volatile ]; then
                  if ! grep -q 'Commit durability: volatile' "$log"; then
                    echo "SWITCH_FAIL: $log has no volatile startup line" >&2
                    exit 1
                  fi
                  if grep -q 'SetCommitDurability .*result=ok .*effective=' "$log"; then
                    echo "SWITCH_FAIL: $log records a switch under a volatile sweep" >&2
                    exit 1
                  fi
                  reply="(volatile: no barrier)"
                else
                  expected="ok mode=$(printf '%s' "$measured" | tr 'a-z' 'A-Z')"
                  reply=$(~/helios/build/server/lineairdb-ctl --host 127.0.0.1 --port 9999 \
                            set-durability "$measured") || {
                    echo "SWITCH_FAIL: lineairdb-ctl exited non-zero" >&2
                    exit 1
                  }
                  if [ "$reply" != "$expected" ]; then
                    echo "SWITCH_FAIL: expected '$expected', got '$reply'" >&2
                    exit 1
                  fi
                fi
                ended=$(date +%s.%N)
                rss_after=$(awk '/^VmRSS:/{print $2}' "/proc/$pid/status" || true)
                wal_after=$(wal_file_bytes)
                echo "mode_before=$mode_before"
                echo "mode_after=$measured"
                echo "reply=$reply"
                echo "elapsed_seconds=$(awk -v a="$started" -v b="$ended" \
                                           'BEGIN { printf "%.3f", b - a }')"
                echo "rss_kb_before=$rss_before"
                echo "rss_kb_after=$rss_after"
                echo "wal_file_bytes_before=$wal_before"
                echo "wal_file_bytes_after=$wal_after"
              args:
                executable: /bin/bash
              register: durability_switch

            - name: Show the durability record
              debug:
                var: durability_switch.stdout_lines

            - name: Append the durability record
              # One block per run: re-running the sweep must not erase what the
              # previous one recorded.
              delegate_to: localhost
              blockinfile:
                path: "{{ result_dir }}/durability_switch.txt"
                create: true
                marker: "# {mark} durability {{ durability_switch.start }}"
                block: "{{ durability_switch.stdout }}"

    - name: Start mpstat sampling
      shell: |
        mkdir -p {{ sample_dir }}
        nohup mpstat -P ALL {{ sample_interval }} > {{ sample_dir }}/cpu-{{ run_id }}.log 2>&1 &
        echo $! > {{ sample_dir }}/cpu-{{ run_id }}.pid
      args:
        executable: /bin/bash

    - name: Start server pidstat sampling (lineairdb)
      when: inventory_hostname in groups.get('lineairdb', [])
      shell: |
        mkdir -p {{ sample_dir }}
        pid=$(pgrep -f '[/]build/server/lineairdb-server' | head -n1 || true)
        if [ -z "$pid" ]; then
          echo "lineairdb-server not running" > {{ sample_dir }}/pidstat-server-{{ run_id }}.log
          exit 0
        fi
        nohup pidstat -w -p "$pid" {{ sample_interval }} > {{ sample_dir }}/pidstat-server-{{ run_id }}.log 2>&1 &
        echo $! > {{ sample_dir }}/pidstat-server-{{ run_id }}.pid
      args:
        executable: /bin/bash

    - name: Start sar -w sampling (lineairdb)
      when: inventory_hostname in groups.get('lineairdb', [])
      shell: |
        mkdir -p {{ sample_dir }}
        nohup sar -w {{ sample_interval }} > {{ sample_dir }}/sar-w-{{ run_id }}.log 2>&1 &
        echo $! > {{ sample_dir }}/sar-w-{{ run_id }}.pid
      args:
        executable: /bin/bash

    - name: Start sar -n DEV sampling (lineairdb)
      when: inventory_hostname in groups.get('lineairdb', [])
      shell: |
        mkdir -p {{ sample_dir }}
        nohup sar -n DEV {{ sample_interval }} > {{ sample_dir }}/sar-dev-{{ run_id }}.log 2>&1 &
        echo $! > {{ sample_dir }}/sar-dev-{{ run_id }}.pid
      args:
        executable: /bin/bash

    - name: Start sar -d sampling (lineairdb)
      # Block-device await/queue/throughput: the WAL volume's view of Sync
      when: inventory_hostname in groups.get('lineairdb', [])
      shell: |
        mkdir -p {{ sample_dir }}
        nohup sar -d -p {{ sample_interval }} > {{ sample_dir }}/sar-disk-{{ run_id }}.log 2>&1 &
        echo $! > {{ sample_dir }}/sar-disk-{{ run_id }}.pid
      args:
        executable: /bin/bash

    - name: Start sar -n SOFT sampling (lineairdb)
      when: inventory_hostname in groups.get('lineairdb', [])
      shell: |
        mkdir -p {{ sample_dir }}
        nohup sar -n SOFT {{ softnet_interval }} > {{ sample_dir }}/sar-soft-{{ run_id }}.log 2>&1 &
        echo $! > {{ sample_dir }}/sar-soft-{{ run_id }}.pid
      args:
        executable: /bin/bash

    - name: Start mpstat -I ALL sampling (lineairdb)
      when: inventory_hostname in groups.get('lineairdb', [])
      shell: |
        mkdir -p {{ sample_dir }}
        nohup mpstat -I ALL {{ sample_interval }} > {{ sample_dir }}/mpstat-irq-{{ run_id }}.log 2>&1 &
        echo $! > {{ sample_dir }}/mpstat-irq-{{ run_id }}.pid
      args:
        executable: /bin/bash

    - name: Start softnet_stat sampling (lineairdb)
      when: inventory_hostname in groups.get('lineairdb', [])
      shell: |
        mkdir -p {{ sample_dir }}
        nohup bash -c '
        while true; do
          ts=$(date +%s)
          echo "# ts=$ts"
          cat /proc/softnet_stat
          echo
          sleep {{ softnet_interval }}
        done' > {{ sample_dir }}/softnet-{{ run_id }}.log 2>&1 &
        echo $! > {{ sample_dir }}/softnet-{{ run_id }}.pid
      args:
        executable: /bin/bash

    - name: Start /proc/interrupts sampling (lineairdb)
      when: inventory_hostname in groups.get('lineairdb', [])
      shell: |
        mkdir -p {{ sample_dir }}
        nohup bash -c '
        while true; do
          ts=$(date +%s)
          echo "# ts=$ts"
          cat /proc/interrupts
          echo
          sleep {{ interrupt_interval }}
        done' > {{ sample_dir }}/interrupts-{{ run_id }}.log 2>&1 &
        echo $! > {{ sample_dir }}/interrupts-{{ run_id }}.pid
      args:
        executable: /bin/bash

    - name: Start mysqld pidstat sampling (mysql)
      when: inventory_hostname in groups.get('mysql', [])
      shell: |
        mkdir -p {{ sample_dir }}
        pid=$(pgrep -f '[r]untime_output_directory/mysqld' | head -n1 || true)
        if [ -z "$pid" ]; then
          echo "mysqld not running" > {{ sample_dir }}/pidstat-mysql-{{ run_id }}.log
          exit 0
        fi
        nohup pidstat -u -w -p "$pid" {{ sample_interval }} > {{ sample_dir }}/pidstat-mysql-{{ run_id }}.log 2>&1 &
        echo $! > {{ sample_dir }}/pidstat-mysql-{{ run_id }}.pid
      args:
        executable: /bin/bash

    - name: Start benchbase pidstat sampling (benchbase)
      when: inventory_hostname in groups.get('benchbase', [])
      shell: |
        mkdir -p {{ sample_dir }}
        nohup bash -c '
        pid=""
        while [ -z "$pid" ]; do
          pid=$(ps -eo pid=,comm=,args= | awk '"'"'$2 == "java" && index($0, "benchbase.jar") { print $1; exit }'"'"')
          [ -z "$pid" ] && sleep 1
        done
        echo "benchbase_java_pid=$pid"
        pidstat -u -w -p "$pid" {{ sample_interval }}
        ' > {{ sample_dir }}/pidstat-bench-{{ run_id }}.log 2>&1 &
        echo $! > {{ sample_dir }}/pidstat-bench-{{ run_id }}.pid
      args:
        executable: /bin/bash

    - name: Start server per-thread pidstat sampling (lineairdb)
      when: inventory_hostname in groups.get('lineairdb', [])
      shell: |
        mkdir -p {{ sample_dir }}
        pid=$(pgrep -f '[/]build/server/lineairdb-server' | head -n1 || true)
        if [ -z "$pid" ]; then
          echo "lineairdb-server not running" > {{ sample_dir }}/pidstat-threads-{{ run_id }}.log
          exit 0
        fi
        nohup pidstat -t -u -p "$pid" 5 > {{ sample_dir }}/pidstat-threads-{{ run_id }}.log 2>&1 &
        echo $! > {{ sample_dir }}/pidstat-threads-{{ run_id }}.pid
      args:
        executable: /bin/bash

    - name: Start vmstat sampling (all nodes)
      shell: |
        mkdir -p {{ sample_dir }}
        nohup vmstat {{ sample_interval }} > {{ sample_dir }}/vmstat-{{ run_id }}.log 2>&1 &
        echo $! > {{ sample_dir }}/vmstat-{{ run_id }}.pid
      args:
        executable: /bin/bash

    # IPC / LLC counters for the SWEEP phase, query + storage nodes only
    - include_tasks: tasks/perf_stat_start.yml
      vars:
        perf_stat_dir: "{{ sample_dir }}"
        perf_stat_label: sweep
      when:
        - perf_stat | bool
        - inventory_hostname in groups.get('lineairdb', []) + groups.get('mysql', [])

    - name: Install perf and configure sysctl (lineairdb + mysql)
      when: (enable_perf | bool) and (inventory_hostname in groups.get('lineairdb', []) + groups.get('mysql', []))
      become: yes
      tags: [privileged]
      shell: |
        apt-get install -y -qq linux-tools-aws 2>/dev/null || true
        sysctl -w kernel.perf_event_paranoid=0
        sysctl -w kernel.kptr_restrict=0
      args:
        executable: /bin/bash

    - name: Detect perf binary path (lineairdb + mysql)
      when: (enable_perf | bool) and (inventory_hostname in groups.get('lineairdb', []) + groups.get('mysql', []))
      shell: |
        find /usr/lib/linux-*-tools-* -name perf -type f 2>/dev/null | head -1
      register: perf_bin_result
      args:
        executable: /bin/bash

    - name: Set perf binary fact
      when: (enable_perf | bool) and (inventory_hostname in groups.get('lineairdb', []) + groups.get('mysql', []))
      set_fact:
        perf_bin: "{{ perf_bin_result.stdout | default('') }}"

    - name: Warn if perf not found
      when: (enable_perf | bool) and (inventory_hostname in groups.get('lineairdb', []) + groups.get('mysql', [])) and (perf_bin is not defined or perf_bin == '')
      debug:
        msg: "WARNING: perf binary not found on {{ inventory_hostname }}, skipping profiling"

    - name: Start perf record on lineairdb server
      when: (enable_perf | bool) and inventory_hostname in groups.get('lineairdb', []) and (perf_bin is defined and perf_bin != '')
      shell: |
        mkdir -p {{ sample_dir }}
        pid=$(pgrep -f '[/]build/server/lineairdb-server' | head -n1 || true)
        if [ -z "$pid" ]; then
          echo "lineairdb-server not running, skipping perf" > {{ sample_dir }}/perf-server-{{ run_id }}.log
          exit 0
        fi
        nohup {{ perf_bin }} record -g -F {{ perf_freq }} -p "$pid" \
          -o {{ sample_dir }}/perf-server-{{ run_id }}.data \
          -- sleep 3600 > {{ sample_dir }}/perf-server-{{ run_id }}.log 2>&1 &
        echo $! > {{ sample_dir }}/perf-server-{{ run_id }}.pid
      args:
        executable: /bin/bash

    - name: Start perf record on mysqld
      when: (enable_perf | bool) and inventory_hostname in groups.get('mysql', []) and (perf_bin is defined and perf_bin != '')
      shell: |
        mkdir -p {{ sample_dir }}
        pid=$(pgrep -f '[r]untime_output_directory/mysqld' | head -n1 || true)
        if [ -z "$pid" ]; then
          echo "mysqld not running, skipping perf" > {{ sample_dir }}/perf-proxy-{{ run_id }}.log
          exit 0
        fi
        nohup {{ perf_bin }} record -g -F {{ perf_freq }} -p "$pid" \
          -o {{ sample_dir }}/perf-proxy-{{ run_id }}.data \
          -- sleep 3600 > {{ sample_dir }}/perf-proxy-{{ run_id }}.log 2>&1 &
        echo $! > {{ sample_dir }}/perf-proxy-{{ run_id }}.pid
      args:
        executable: /bin/bash

- hosts: mysql
  gather_facts: false
  vars:
    run_id: "run"
    sample_dir: /tmp/metrics
  tasks:
    - name: Capture MySQL diagnostics BEFORE benchmark (pre)
      shell: |
        MYSQL=~/helios/build/runtime_output_directory/mysql
        OUT={{ sample_dir }}/mysql-diag-pre-{{ run_id }}.txt
        mkdir -p {{ sample_dir }}
        {
          echo "=== SHOW TABLE STATUS ==="
          $MYSQL -u root --protocol=TCP -h 127.0.0.1 -P 3307 benchbase \
            -e "SHOW TABLE STATUS"
          echo ""
          echo "=== SHOW INDEX (all tables) ==="
          for tbl in warehouse district customer history item new_order oorder order_line stock; do
            echo "--- $tbl ---"
            $MYSQL -u root --protocol=TCP -h 127.0.0.1 -P 3307 benchbase \
              -e "SHOW INDEX FROM $tbl"
          done
          echo ""
          echo "=== EXPLAIN Delivery (customer lookup) ==="
          $MYSQL -u root --protocol=TCP -h 127.0.0.1 -P 3307 benchbase \
            -e "EXPLAIN SELECT c_id, c_balance, c_delivery_cnt FROM customer WHERE c_w_id=1 AND c_d_id=1 AND c_id=1"
          echo ""
          echo "=== EXPLAIN Payment by name ==="
          $MYSQL -u root --protocol=TCP -h 127.0.0.1 -P 3307 benchbase \
            -e "EXPLAIN SELECT c_id FROM customer WHERE c_w_id=1 AND c_d_id=1 AND c_last='BARBARBAR' ORDER BY c_first"
          echo ""
          echo "=== EXPLAIN StockLevel ==="
          $MYSQL -u root --protocol=TCP -h 127.0.0.1 -P 3307 benchbase \
            -e "EXPLAIN SELECT COUNT(DISTINCT s_i_id) FROM order_line, stock WHERE ol_w_id=1 AND ol_d_id=1 AND ol_o_id BETWEEN 1 AND 100 AND s_w_id=1 AND s_i_id=ol_i_id AND s_quantity<10"
          echo ""
          echo "=== LineairDB server variables ==="
          $MYSQL -u root --protocol=TCP -h 127.0.0.1 -P 3307 \
            -e "SHOW VARIABLES LIKE 'lineairdb%'"
        } > "$OUT" 2>&1
      args:
        executable: /bin/bash
      failed_when: false

    - name: Capture MySQL status snapshot BEFORE benchmark (pre)
      # Com_commit post-pre per node is the per-endpoint load-balance evidence
      shell: |
        ~/helios/build/runtime_output_directory/mysql \
          -u root --protocol=TCP -h 127.0.0.1 -P 3307 \
          -e "SHOW GLOBAL STATUS" > {{ sample_dir }}/mysql-status-pre-{{ run_id }}.txt
      args:
        executable: /bin/bash
      failed_when: false

    - name: Fetch MySQL status snapshot (pre)
      fetch:
        src: "{{ sample_dir }}/mysql-status-pre-{{ run_id }}.txt"
        dest: "{{ result_dir }}/mysql/{{ inventory_hostname }}/"
        flat: yes
      failed_when: false

- import_playbook: measure.yml

- hosts: lineairdb:mysql:benchbase
  gather_facts: false
  vars:
    run_id: "run"
    sample_dir: /tmp/metrics
    enable_perf: false
    perf_stat: false
  tasks:
    # Stop perf FIRST (before any other cleanup) to ensure the target
    # process is still alive when perf flushes its data.
    - name: Stop perf and generate reports (lineairdb) [early]
      when: (enable_perf | bool) and inventory_hostname in groups.get('lineairdb', [])
      shell: |
        if [ -f {{ sample_dir }}/perf-server-{{ run_id }}.pid ]; then
          PID=$(cat {{ sample_dir }}/perf-server-{{ run_id }}.pid)
          if kill -0 "$PID" 2>/dev/null; then
            kill -INT "$PID"
            # Wait for perf to finish writing
            for i in $(seq 1 30); do
              kill -0 "$PID" 2>/dev/null || break
              sleep 1
            done
          fi
        fi
        if [ -f {{ sample_dir }}/perf-server-{{ run_id }}.data ] && \
           [ "$(stat -c%s {{ sample_dir }}/perf-server-{{ run_id }}.data 2>/dev/null)" -gt 1000 ]; then
          {{ perf_bin | default('perf') }} report -i {{ sample_dir }}/perf-server-{{ run_id }}.data \
            --stdio --no-children -g none --percent-limit 0.1 \
            > {{ sample_dir }}/perf-report-server-{{ run_id }}.txt 2>&1
          {{ perf_bin | default('perf') }} report -i {{ sample_dir }}/perf-server-{{ run_id }}.data \
            --stdio --no-children -g flat,0,caller --percent-limit 0.5 \
            > {{ sample_dir }}/perf-callers-server-{{ run_id }}.txt 2>&1
          rm -f {{ sample_dir }}/perf-server-{{ run_id }}.data
        fi
      args:
        executable: /bin/bash
      failed_when: false

    - name: Stop perf and generate reports (mysql) [early]
      when: (enable_perf | bool) and inventory_hostname in groups.get('mysql', [])
      shell: |
        if [ -f {{ sample_dir }}/perf-proxy-{{ run_id }}.pid ]; then
          PID=$(cat {{ sample_dir }}/perf-proxy-{{ run_id }}.pid)
          if kill -0 "$PID" 2>/dev/null; then
            kill -INT "$PID"
            for i in $(seq 1 30); do
              kill -0 "$PID" 2>/dev/null || break
              sleep 1
            done
          fi
        fi
        if [ -f {{ sample_dir }}/perf-proxy-{{ run_id }}.data ] && \
           [ "$(stat -c%s {{ sample_dir }}/perf-proxy-{{ run_id }}.data 2>/dev/null)" -gt 1000 ]; then
          {{ perf_bin | default('perf') }} report -i {{ sample_dir }}/perf-proxy-{{ run_id }}.data \
            --stdio --no-children -g none --percent-limit 0.1 \
            > {{ sample_dir }}/perf-report-proxy-{{ run_id }}.txt 2>&1
          {{ perf_bin | default('perf') }} report -i {{ sample_dir }}/perf-proxy-{{ run_id }}.data \
            --stdio --no-children -g flat,0,caller --percent-limit 0.5 \
            > {{ sample_dir }}/perf-callers-proxy-{{ run_id }}.txt 2>&1
          rm -f {{ sample_dir }}/perf-proxy-{{ run_id }}.data
        fi
      args:
        executable: /bin/bash
      failed_when: false

    - name: Stop mpstat sampling
      shell: |
