    - name: "Gate: every MySQL carried its share of the commits"
      # Connector/J silently routes around a dead endpoint, so an N-1 fleet
      # would otherwise still produce a green sweep.
      run_once: true
      delegate_to: localhost
      shell: |
        set -euo pipefail
        python3 - "{{ result_dir }}" "{{ run_id }}" {{ groups['mysql'] | join(' ') }} <<'PY'
        import os
        import re, sys
        result_dir, run_id, hosts = sys.argv[1], sys.argv[2], sys.argv[3:]
        def com_commit(path):
            try:
                text = open(path).read()
            except OSError:
                return None
            m = re.search(r"^Com_commit\s+(\d+)", text, re.M)
            return int(m.group(1)) if m else None
        deltas = {}
        for h in hosts:
            pre = com_commit(f"{result_dir}/mysql/{h}/mysql-status-pre-{run_id}.txt")
            post = com_commit(f"{result_dir}/mysql/{h}/mysql-status-{run_id}.txt")
            deltas[h] = None if pre is None or post is None else post - pre
        lines = [f"{h},{'missing' if d is None else d}" for h, d in deltas.items()]
        os.makedirs(f"{result_dir}/throughput", exist_ok=True)
        with open(f"{result_dir}/throughput/commit_distribution.csv", "w") as f:
            f.write("host,com_commit_delta\n" + "\n".join(lines) + "\n")
        print("\n".join(lines))
        valid = [d for d in deltas.values() if d is not None]
        if len(valid) != len(hosts):
            sys.exit("GATE FAIL: missing commit counts for some MySQL nodes")
        # The gate needs enough explicit commits; autocommit workloads such as TPC-H skip it
        if sum(valid) < 1000:
            print("GATE SKIPPED: fewer than 1000 commits in the sweep")
        elif min(valid) <= 0 or min(valid) < 0.5 * max(valid):
            sys.exit("GATE FAIL: uneven commit counts across MySQL nodes")
        else:
            print("GATE OK: commit counts within 2x across nodes")
        PY
      args:
        executable: /bin/bash
