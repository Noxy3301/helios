    - name: Dump and pack the WAL flush trace (lineairdb)
      # SIGUSR1 asks the server to write <prefix>_g<gen>_*.csv and finally
      # <prefix>_meta.csv; wait for the manifest before packing. Only a server
      # holding <prefix>.lock has the handler; SIGUSR1 kills any other process
      when: inventory_hostname in groups.get('lineairdb', []) and (helios_flush_trace | default('')) != ''
      shell: |
        set -euo pipefail
        prefix={{ helios_flush_trace }}
        pid=$(cat /tmp/lineairdb_server.pid)
        tr '\0' ' ' < /proc/$pid/cmdline | grep -q 'build/server/lineairdb-server' || { echo "pid $pid is not lineairdb-server" >&2; exit 1; }
        grep -qxF -- "${prefix}.lock" < <(readlink /proc/$pid/fd/* 2>/dev/null) || { echo "server does not hold ${prefix}.lock: tracing inactive" >&2; exit 1; }
        rm -f "${prefix}_meta.csv"
        kill -USR1 "$pid"
        for i in $(seq 1 90); do
          [ -f "${prefix}_meta.csv" ] && break
          sleep 2
        done
        [ -f "${prefix}_meta.csv" ] || { echo "flush trace manifest did not appear" >&2; exit 1; }
        tar -C "$(dirname "$prefix")" -czf {{ sample_dir }}/flush-trace-{{ run_id }}.tgz $(cd "$(dirname "$prefix")" && ls "$(basename "$prefix")"_*.csv)
      args:
        executable: /bin/bash
      # A missing trace must not cost the rest of the storage node's logs
      ignore_errors: true

    - name: Stop sar -n SOFT sampling (lineairdb)
      when: inventory_hostname in groups.get('lineairdb', [])
      shell: |
        if [ -f {{ sample_dir }}/sar-soft-{{ run_id }}.pid ]; then
