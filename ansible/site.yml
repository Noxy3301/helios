---
# Raise file descriptor limits on all nodes
#
# bench_aws.py does not run this file; it invokes lineairdb.yml, mysql.yml and
# benchbase.yml directly, which is why ENA queue tuning is wired into those
# playbooks. Kept for manual runs, which pass bundle_path and bundle_sha256.
- hosts: all
  become: true
  tags: [privileged]
  gather_facts: false
  tasks:
    - name: Set system-wide nofile limits
      copy:
        dest: /etc/security/limits.d/99-helios.conf
        content: |
          * soft nofile 1048576
          * hard nofile 1048576
          root soft nofile 1048576
          root hard nofile 1048576
    - name: Set sysctl fs.file-max
      sysctl:
        name: fs.file-max
        value: "2097152"
        sysctl_set: true

- import_playbook: push_bundle.yml
- import_playbook: lineairdb.yml
- import_playbook: mysql.yml
- import_playbook: benchbase.yml
