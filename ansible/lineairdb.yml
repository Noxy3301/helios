---
# Start the LineairDB server from the pushed bundle (push_bundle.yml runs first;
# there is no repository or build step on the node).
- hosts: lineairdb
  gather_facts: false
  vars:
    lineairdb_nofile_limit: 1048576
  tasks:
    - name: Start LineairDB-Server
      # Never pipe the start scripts: log to a file and verify liveness explicitly
      shell: |
        set -euo pipefail
        cd ~/helios
        ./scripts/stop_server.sh > /dev/null 2>&1 || true
        sleep 1
        ulimit -n {{ lineairdb_nofile_limit }}
        ./scripts/start_server.sh > /tmp/start_server.log 2>&1
        sleep 2
        # Bracketed: the pattern kill in stop_server.sh must not match this shell
        pgrep -f '[b]uild/server/lineairdb-server' > /dev/null || {
          echo "lineairdb-server did not stay up:"; cat /tmp/start_server.log
          tail -20 ~/helios/lineairdb_logs/lineairdb_server_*.log 2>/dev/null
          exit 1
        }
        echo "lineairdb-server up (nofile=$(ulimit -n))"
      args:
        executable: /bin/bash
      register: server_start

    - name: Show server start log
      debug:
        var: server_start.stdout_lines
