syntax = "proto3";

package LineairDB.Protocol;

// Identifies which RPC is being invoked.
enum OpCode {
    UNKNOWN = 0;

    // Transaction lifecycle
    TX_BEGIN_TRANSACTION = 1;
    TX_ABORT = 2;

    // Primary key operations
    TX_READ = 3;
    TX_WRITE = 4;
    TX_DELETE = 5;

    // Secondary index operations
    TX_READ_SECONDARY_INDEX = 6;
    TX_WRITE_SECONDARY_INDEX = 7;
    TX_DELETE_SECONDARY_INDEX = 8;
    TX_UPDATE_SECONDARY_INDEX = 9;

    // Primary key scan operations
    TX_GET_MATCHING_KEYS_IN_RANGE = 10;
    TX_GET_MATCHING_KEYS_AND_VALUES_IN_RANGE = 11;
    TX_GET_MATCHING_KEYS_AND_VALUES_FROM_PREFIX = 12;
    TX_FETCH_LAST_KEY_IN_RANGE = 13;
    TX_FETCH_FIRST_KEY_WITH_PREFIX = 14;
    TX_FETCH_NEXT_KEY_WITH_PREFIX = 15;

    // Secondary index scan operations
    TX_GET_MATCHING_PRIMARY_KEYS_IN_RANGE = 16;
    TX_GET_MATCHING_PRIMARY_KEYS_FROM_PREFIX = 17;
    TX_FETCH_LAST_PRIMARY_KEY_IN_SECONDARY_RANGE = 18;
    TX_FETCH_LAST_SECONDARY_ENTRY_IN_RANGE = 19;

    // Database operations
    DB_FENCE = 20;
    DB_END_TRANSACTION = 21;
    DB_CREATE_TABLE = 22;
    DB_SET_TABLE = 23;
    DB_CREATE_SECONDARY_INDEX = 24;

    // Batch operations
    TX_BATCH_READ = 25;
    TX_BATCH_WRITE = 26;

    // Experimental prefetch operations
    TX_STATELESS_READ = 27;
    TX_STATELESS_BATCH_READ = 28;
    TX_VALIDATE_AND_COMMIT = 29;
    TX_EXECUTE_READ_PLAN = 30;
    TX_GET_TABLE_STATS = 31;

    // Secondary-engine computation pushdown: execute a whole query block
    // (scans, joins, aggregation, sort, limit) server-side over PAX strips.
    TX_EXECUTE_QUERY_BLOCK = 36;
}

enum BatchOpType {
    BATCH_OP_UNKNOWN = 0;
    BATCH_OP_WRITE = 1;
    BATCH_OP_DELETE = 2;
    BATCH_OP_SECONDARY_INDEX_WRITE = 3;
    BATCH_OP_SECONDARY_INDEX_DELETE = 4;
}

// Shared key-value pair used across scan responses.
message KeyValue {
    bytes key = 1;
    bytes value = 2;
}

// Range read observed by a stateless scan. The commit re-runs the scan
// described by the bounds and asserts the observed key set is unchanged.
message RangeReadEntry {
    string table_name = 1;
    string index_name = 2; // Empty means primary index.
    bytes start_key = 3;
    bytes end_key = 4;
    uint64 row_limit = 5; // 0 means compare the whole range.
    bool reverse_scan = 6;
    repeated bytes result_keys = 7; // PK scan: primary keys. SI scan: secondary keys.
    repeated bytes result_primary_keys = 8; // SI scan only.
}

// Secondary index entry: a secondary key and its associated primary keys.
message SecondaryIndexEntry {
    bytes secondary_key = 1;
    repeated bytes primary_keys = 2;
}

// Begin a new transaction. Returns a server-assigned transaction ID.
// Response includes current row counts for all tables so proxies can
// feed accurate cardinalities to the MySQL optimizer.
message TxBeginTransaction {
    message Request {}
    message Response {
        int64 transaction_id = 1;
        repeated TableRowCount table_stats = 2;
    }
}

// Fetch optimizer stats before the proxy opens a LineairDB transaction.
message GetTableStats {
    message IndexDesc {
        string index_name = 1; // Empty means primary index.
        uint32 num_key_parts = 2; // Number of leading key parts to measure.
    }
    message Request {
        string ndv_table = 1; // Table to compute NDV for; empty means row counts only.
        repeated IndexDesc ndv_indexes = 2;
        bool ndv_force_recompute = 3; // ANALYZE TABLE forces NDV recomputation.
    }
    // NDV (Number of Distinct Values) per key-prefix length.
    message IndexNdv {
        string index_name = 1;
        bool available = 2; // False when NDV is unavailable for this index.
        repeated uint64 ndv = 3;
        // Leading-key range histogram. bounds[i] is a raw encoded leading-key
        // boundary; cum[i] is the cumulative live-row count up to that bound.
        repeated bytes hist_bounds = 4;
        repeated uint64 hist_cum = 5;
        bool hist_available = 6;
    }
    message Response {
        repeated TableRowCount table_stats = 1;
        repeated IndexNdv index_ndv = 2;
    }
}

// Abort a transaction.
message TxAbort {
    message Request {
        int64 transaction_id = 1;
    }
    message Response {}
}

// Read multiple values by primary key in a single round-trip.
// Used by MRR (Multi-Range Read) to batch JOIN lookups.
message TxBatchRead {
    message Request {
        int64 transaction_id = 1;
        repeated bytes keys = 2;
        string table_name = 3;
    }
    message ReadResult {
        bool found = 1;
        bytes value = 2;
    }
    message Response {
        repeated ReadResult results = 1;
        bool is_aborted = 2;
    }
}

// Flush writes and deletes in the same order MySQL issued them.
message TxBatchWrite {
    message BatchOp {
        BatchOpType type = 1;
        bytes key = 2;
        bytes value = 3;
        string index_name = 4;
        bytes secondary_key = 5;
        bytes primary_key = 6;
        string table_name = 7;
    }
    message Request {
        int64 transaction_id = 1;
        string table_name = 2;
        // Operations are applied in the same order as MySQL issued them.
        repeated BatchOp ops = 3;
    }
    message Response {
        bool success = 1;
        bool is_aborted = 2;
    }
}

// Read a primary-key value without opening a server-side transaction.
// The returned TID is validated later by TxValidateAndCommit.
message TxStatelessRead {
    message Request {
        string table_name = 1;
        bytes key = 2;
    }
    message Response {
        bool found = 1;
        bytes value = 2;
        uint64 tid = 3;
    }
}

// Read multiple primary-key values without opening a server-side transaction.
message TxStatelessBatchRead {
    message ReadOp {
        string table_name = 1;
        bytes key = 2;
    }
    message Request {
        repeated ReadOp ops = 1;
    }
    message ReadResult {
        bool found = 1;
        bytes value = 2;
        uint64 tid = 3;
    }
    message Response {
        repeated ReadResult results = 1;
    }
}

// Execute a dependent read plan in one RPC.
// Steps may read values produced by earlier steps to build later keys.
message TxExecuteReadPlan {
    message KeyBinding {
        uint32 source_step = 1;
        uint32 source_row = 2;
        uint32 source_offset = 3;
        uint32 source_length = 4; // 0 means the rest of the source bytes.
        bool use_midpoint = 5;
        bool from_key = 6;
        int32 source_column = 7; // 1-based row column; 0 means disabled.
        bool column_as_int_key = 8;
        int64 int_delta = 9;
    }
    message PlanStep {
        string table_name = 1;
        bytes key_prefix = 2;
        bytes end_key_prefix = 3;
        bool is_scan = 4;
        uint64 scan_limit = 5; // 0 means no limit.
        string index_name = 6; // Empty means primary index.
        repeated KeyBinding bindings = 7;
        repeated KeyBinding end_bindings = 8;
        bool for_each = 9;
        bool reverse_scan = 10;
        PushedPredicate filter = 11; // Optional row filter for staged scans.
        // Optional column subset for staged rows. The server keeps full null
        // flags, sends only listed column values, and filters before trimming.
        RowProjection projection = 12;
        // Optional aggregation for a staged primary scan.
        AggregateSpec aggregate = 13;
        // Optional membership reduction for high-fanout join probes.
        repeated SemijoinFilter semijoins = 14;
        // Anti-join probe: only the existence of a match matters, never the
        // inner rows. Emit at most one row per probe key. A complete answer,
        // not a truncated window -- index_next still reports a clean EOF.
        bool existence_only = 15;
    }
    // Drop probe rows whose join key is absent from an earlier step's result.
    // Columns are 0-based TABLE::field[] ordinals.
    message SemijoinFilter {
        uint32 source_step = 1;
        uint32 source_column = 2;
        uint32 probe_column = 3;
        // Optional filter applied while building the source membership set.
        PushedPredicate source_filter = 4;
    }
    message RowProjection {
        uint32 num_columns = 1; // table->s->fields
        repeated uint32 field_indexes = 2 [packed = true]; // 0-based, sorted.
    }
    message StepResult {
        bool found = 1;
        bytes value = 2;
        uint64 tid = 3;
        bytes actual_key = 4;
        repeated bytes scan_keys = 5;
        repeated bytes scan_values = 6;
        repeated uint64 scan_tids = 7;
        repeated bytes secondary_keys = 8;
        bytes actual_start_key = 9;
        bytes actual_end_key = 10;
        // for_each range probes return one group per deduplicated start key.
        // group_sizes[i] rows belong to [group_start_keys[i], group_end_keys[i]).
        repeated uint32 group_sizes = 11;
        repeated bytes group_start_keys = 12;
        repeated bytes group_end_keys = 13;
        // Primary keys rejected by the pushed scan filter. The proxy records
        // them as negative row-cache entries for later point probes.
        repeated bytes filtered_keys = 14;
    }
    message Request {
        repeated PlanStep steps = 1;
    }
    message Response {
        repeated StepResult results = 1;
        bool ok = 2;
    }
}

// Validate stateless reads and install buffered writes in one RPC.
message TxValidateAndCommit {
    message ReadEntry {
        string table_name = 1;
        bytes key = 2;
        uint64 tid = 3;
        bool found = 4;
    }
    message WriteEntry {
        string table_name = 1;
        bytes key = 2;
        bytes value = 3;
        bool is_delete = 4;
    }
    message DeleteEntry {
        string table_name = 1;
        bytes key = 2;
    }
    message SecondaryIndexEntry {
        string table_name = 1;
        string index_name = 2;
        bytes secondary_key = 3;
        bytes primary_key = 4;
        bool is_delete = 5;
    }
    message Request {
        repeated ReadEntry reads = 1;
        repeated WriteEntry writes = 2;
        repeated DeleteEntry deletes = 3;
        repeated SecondaryIndexEntry secondary_index_ops = 4;
        repeated TableRowDelta row_deltas = 5;
        bool fence = 6;
        repeated RangeReadEntry range_reads = 7;
    }
    message Response {
        bool committed = 1;
        repeated TableRowCount table_stats = 2;
        string abort_reason = 3;
    }
}

// Read a single value by primary key.
message TxRead {
    message Request {
        int64 transaction_id = 1;
        bytes key = 2;
        string table_name = 4;
    }
    message Response {
        bool found = 1;
        bytes value = 2;
        bool is_aborted = 3;
    }
}

// Write a value by primary key.
message TxWrite {
    message Request {
        int64 transaction_id = 1;
        bytes key = 2;
        bytes value = 3;
        string table_name = 5;
    }
    message Response {
        bool success = 1;
        bool is_aborted = 2;
    }
}

// Wait for all pending transactions to be durably committed.
message DbFence {
    message Request {}
    message Response {}
}

// Row-count delta reported by proxy on commit (piggybacked on EndTransaction).
message TableRowDelta {
    string table_name = 1;
    int64 delta = 2;
}

// Snapshot of a single table's row count, returned by server in BEGIN/END.
message TableRowCount {
    string table_name = 1;
    int64 row_count = 2;
}

// Commit or abort a transaction.
// @param fence  If true, block until the transaction is durably committed.
// @param row_deltas  Row-count changes accumulated during this transaction.
//   Server applies these only on successful commit and returns updated
//   table_stats in the response for the proxy's next transaction.
message DbEndTransaction {
    message Request {
        int64 transaction_id = 1;
        bool fence = 2;
        repeated TableRowDelta row_deltas = 3;
    }
    message Response {
        bool is_aborted = 1;
        repeated TableRowCount table_stats = 2;
    }
}

// Delete a value by primary key.
message TxDelete {
    message Request {
        int64 transaction_id = 1;
        bytes key = 2;
        string table_name = 4;
    }
    message Response {
        bool success = 1;
        bool is_aborted = 2;
    }
}

// Read primary-key values associated with a secondary key.
// @see LineairDBTransaction::read_secondary_index()
message TxReadSecondaryIndex {
    message Request {
        int64 transaction_id = 1;
        string index_name = 2;
        bytes secondary_key = 3;
        string table_name = 4;
    }
    message Response {
        repeated bytes values = 1;
        bool is_aborted = 2;
    }
}

// Write a primary-key entry into a secondary index.
// @see LineairDBTransaction::write_secondary_index()
message TxWriteSecondaryIndex {
    message Request {
        int64 transaction_id = 1;
        string index_name = 2;
        bytes secondary_key = 3;
        bytes primary_key = 4;
        string table_name = 5;
    }
    message Response {
        bool success = 1;
        bool is_aborted = 2;
    }
}

// Remove a primary-key entry from a secondary index.
// @see LineairDBTransaction::delete_secondary_index()
message TxDeleteSecondaryIndex {
    message Request {
        int64 transaction_id = 1;
        string index_name = 2;
        bytes secondary_key = 3;
        bytes primary_key = 4;
        string table_name = 5;
    }
    message Response {
        bool success = 1;
        bool is_aborted = 2;
    }
}

// Atomically move a primary key from one secondary key to another.
// @see LineairDBTransaction::update_secondary_index()
message TxUpdateSecondaryIndex {
    message Request {
        int64 transaction_id = 1;
        string index_name = 2;
        bytes old_secondary_key = 3;
        bytes new_secondary_key = 4;
        bytes primary_key = 5;
        string table_name = 6;
    }
    message Response {
        bool success = 1;
        bool is_aborted = 2;
    }
}

// Create a new table in the database.
// @see LineairDB::Database::CreateTable()
message DbCreateTable {
    message Request {
        string table_name = 1;
        // PAX single-copy storage: max payload bytes per row-format field,
        // index 0 = the null-flags field, then one entry per column in
        // TABLE::field order. Empty = row-store (heap) layout. The server
        // additionally gates on HELIOS_PAX_STORAGE=1; proxies may always
        // send this.
        repeated uint32 pax_field_max_bytes = 2 [packed = true];
    }
    message Response {
        bool success = 1;
    }
}

// Set the table context for a transaction. Subsequent operations
// within this transaction will be scoped to the specified table.
// @see LineairDB::Transaction::SetTable()
message DbSetTable {
    message Request {
        int64 transaction_id = 1;
        string table_name = 2;
    }
    message Response {
        bool success = 1;
    }
}

// Create a secondary index on a table.
// @see LineairDB::Database::CreateSecondaryIndex()
// @param index_type  0=kNone, 2=kDictUnique (LineairDB::Index::SecondaryIndexType)
message DbCreateSecondaryIndex {
    message Request {
        string table_name = 1;
        string index_name = 2;
        uint32 index_type = 3;
    }
    message Response {
        bool success = 1;
    }
}

// Scan keys in [start_key, end_key) range.
// @see LineairDBTransaction::get_matching_keys_in_range()
message TxGetMatchingKeysInRange {
    message Request {
        int64 transaction_id = 1;
        bytes start_key = 2;
        bytes end_key = 3;
        string table_name = 5;
    }
    message Response {
        repeated bytes keys = 1;
        bool is_aborted = 2;
    }
}

// Scan key-value pairs in [start_key, end_key) range.
// Skips tombstones (null/zero-length values).
// @see LineairDBTransaction::get_matching_keys_and_values_in_range()
message TxGetMatchingKeysAndValuesInRange {
    message Request {
        int64 transaction_id = 1;
        bytes start_key = 2;
        bytes end_key = 3;
        PushedPredicate filter = 5;
        string table_name = 6;
        uint64 row_limit = 7; // 0 means no limit.
        bool reverse_scan = 8; // true means scan in descending key order.
    }
    message Response {
        repeated KeyValue results = 1;
        bool is_aborted = 2;
    }
}

// Scan key-value pairs matching a prefix.
// Skips tombstones (null/zero-length values).
// @see LineairDBTransaction::get_matching_keys_and_values_from_prefix()
message TxGetMatchingKeysAndValuesFromPrefix {
    message Request {
        int64 transaction_id = 1;
        bytes prefix = 2;
        PushedPredicate filter = 3;
        string table_name = 4;
    }
    message Response {
        repeated KeyValue results = 1;
        bool is_aborted = 2;
    }
}

// Reverse scan to find the last key in [start_key, end_key) range.
// @see LineairDBTransaction::fetch_last_key_in_range()
message TxFetchLastKeyInRange {
    message Request {
        int64 transaction_id = 1;
        bytes start_key = 2;
        bytes end_key = 3;
        string table_name = 5;
    }
    message Response {
        bool found = 1;
        bytes key = 2;
        bool is_aborted = 3;
    }
}

// Find the first non-tombstone key in [prefix, prefix_end) range.
// @see LineairDBTransaction::fetch_first_key_with_prefix()
message TxFetchFirstKeyWithPrefix {
    message Request {
        int64 transaction_id = 1;
        bytes prefix = 2;
        bytes prefix_end = 3;
        string table_name = 4;
    }
    message Response {
        bool found = 1;
        bytes key = 2;
        bool is_aborted = 3;
    }
}

// Find the next non-tombstone key after last_key in [last_key, prefix_end) range.
// @see LineairDBTransaction::fetch_next_key_with_prefix()
message TxFetchNextKeyWithPrefix {
    message Request {
        int64 transaction_id = 1;
        bytes last_key = 2;
        bytes prefix_end = 3;
        string table_name = 4;
    }
    message Response {
        bool found = 1;
        bytes key = 2;
        bool is_aborted = 3;
    }
}

// Scan primary keys from a secondary index in [start_key, end_key) range.
// @see LineairDBTransaction::get_matching_primary_keys_in_range()
message TxGetMatchingPrimaryKeysInRange {
    message Request {
        int64 transaction_id = 1;
        string index_name = 2;
        bytes start_key = 3;
        bytes end_key = 4;
        string table_name = 6;
    }
    message Response {
        repeated bytes primary_keys = 1;
        bool is_aborted = 2;
    }
}

// Scan primary keys from a secondary index matching a prefix.
// @see LineairDBTransaction::get_matching_primary_keys_from_prefix()
message TxGetMatchingPrimaryKeysFromPrefix {
    message Request {
        int64 transaction_id = 1;
        string index_name = 2;
        bytes prefix = 3;
        string table_name = 4;
    }
    message Response {
        repeated bytes primary_keys = 1;
        bool is_aborted = 2;
    }
}

// Reverse scan to find the last primary key in a secondary index range
// [start_key, end_key).
// @see LineairDBTransaction::fetch_last_primary_key_in_secondary_range()
message TxFetchLastPrimaryKeyInSecondaryRange {
    message Request {
        int64 transaction_id = 1;
        string index_name = 2;
        bytes start_key = 3;
        bytes end_key = 4;
        string table_name = 6;
    }
    message Response {
        bool found = 1;
        bytes primary_key = 2;
        bool is_aborted = 3;
    }
}

// Reverse scan to find the last secondary index entry (secondary key + primary keys)
// in [start_key, end_key) range.
// @see LineairDBTransaction::fetch_last_secondary_entry_in_range()
message TxFetchLastSecondaryEntryInRange {
    message Request {
        int64 transaction_id = 1;
        string index_name = 2;
        bytes start_key = 3;
        bytes end_key = 4;
        string table_name = 6;
    }
    message Response {
        bool found = 1;
        SecondaryIndexEntry entry = 2;
        bool is_aborted = 3;
    }
}

// ============================================================
// Secondary-engine query-block IR (computation pushdown).
//
// A query block is a tree of operators over base tables. Rows are
// represented server-side as tuples of per-table PAX row references
// (late materialization); expressions reference (table_idx, column).
// The response carries final result rows in the proxy row format
// ([null_flags][col_0]..[col_n]) — one field per output expression —
// so the proxy streams them straight into the client protocol.
// ============================================================

message QbAggFunc {
    enum Kind { COUNT = 0; SUM = 1; AVG = 2; MIN = 3; MAX = 4; }
    Kind kind = 1;
    // Table the argument reads from (index into QbRequest.tables).
    uint32 arg_table = 2;
    // Argument expression over that table's columns (FilterExpr arithmetic).
    // COLUMN_REF nodes may address other tables by encoding
    // (table_idx << 16 | column) in column_index when the high bits are set;
    // arg_table remains the default table for untagged refs.
    // Unset for COUNT(*).
    FilterExpr arg = 3;
    // Optional per-row predicate (SUM(CASE WHEN p THEN 1 ELSE 0) => COUNT
    // with filter). Evaluated on the same table as arg_table.
    PushedPredicate filter = 4;
    // Decimal scale of the argument (result formatting).
    uint32 arg_scale = 5;
    // MIN/MAX comparison semantics: 0=numeric(decimal) 1=binary string.
    uint32 cmp_kind = 6;
    // SUM(CASE WHEN p THEN x ELSE 0): a group with no matching rows sums
    // the ELSE branch, i.e. 0 at arg_scale — never NULL.
    bool zero_if_empty = 7;
    // Table the per-row filter reads from (may differ from arg_table:
    // q14 filters on part but sums a lineitem expression).
    uint32 filter_table = 8;
    // COUNT(DISTINCT col): count distinct non-null cell values per group.
    bool distinct = 9;
}

message QbColumnRef {
    uint32 table_idx = 1;
    uint32 column = 2;      // 0-based TABLE::field index
    uint32 cmp_kind = 3;    // 0=int64, 1=binary string, 2=decimal-as-number
    // When >0, group/emit only the first N bytes of the cell. Lowers
    // EXTRACT(YEAR FROM date_col) (dates are "YYYY-MM-DD") to prefix 4.
    uint32 prefix_len = 4;
}

message QbScan {
    uint32 table_idx = 1;
    PushedPredicate filter = 2;  // fully-pushed single-table conjuncts
}

// A predicate over a joined tuple: FilterExpr column_index values are
// ordinals into `columns`, which map to (table, column) refs of the tuple.
// A LEFT-join miss makes a table's columns NULL.
message QbTupleFilter {
    PushedPredicate pred = 1;
    repeated QbColumnRef columns = 2;
}

message QbJoin {
    uint32 build = 1;  // node index into QbRequest.nodes
    uint32 probe = 2;
    // Equi-key pairs (parallel arrays).
    repeated QbColumnRef build_keys = 3;
    repeated QbColumnRef probe_keys = 4;
    enum Type { INNER = 0; LEFT = 1; SEMI = 2; ANTI = 3; }
    Type type = 5;
    // Residual predicate applied per key match, over the combined
    // probe++build tuple. For SEMI/ANTI it decides whether a same-key build
    // row counts as a match (q21's l2.l_suppkey <> l1.l_suppkey).
    QbTupleFilter residual = 6;
}

// Filter a node's tuples by a multi-table predicate (OR-of-ANDs conjuncts
// that reference several tables, e.g. q7/q19).
message QbTupleFilterNode {
    uint32 input = 1;
    QbTupleFilter filter = 2;
}

message QbAggregate {
    uint32 input = 1;                       // node index
    repeated QbColumnRef group_columns = 2; // byte-equality grouping
    repeated QbAggFunc aggs = 3;
    PushedPredicate having = 4;             // over emitted group row (agg idx via num_columns marker semantics)
    // Second-stage re-aggregation (q13 shape): re-group this aggregate's
    // rows by stage-1 value ordinals (0..n_grp-1 = group columns,
    // n_grp.. = aggregates) and COUNT(*) per group. When present, the
    // block's output ordinals refer to the second stage's layout:
    // GROUP ordinal i = group_value_ordinals[i], AGG 0 = the count.
    message SecondStage {
        repeated uint32 group_value_ordinals = 1;
        bool count_star = 2;
    }
    SecondStage second = 5;
}

message QbSortKey {
    // Either an output ordinal (group column / aggregate position in the
    // final output row) ...
    uint32 output_ordinal = 1;
    bool descending = 2;
    uint32 cmp_kind = 3;  // 0=int64 numeric, 1=binary string, 2=decimal numeric
}

// A nested query block (a derived table): executed recursively, its result
// rows become virtual table number (tables_size + k) where k counts
// sub_block nodes in plan order. Virtual-table column refs address the
// sub-block's output ordinals; refs are row numbers.
message QbSubBlock {
    TxExecuteQueryBlock.Request block = 1;
}

message QbNode {
    oneof op {
        QbScan scan = 1;
        QbJoin join = 2;
        QbAggregate aggregate = 3;
        QbTupleFilterNode filter = 4;
        QbSubBlock sub_block = 5;
    }
}

message QbOutputExpr {
    // Output column: a group-key ordinal / aggregate ordinal from the
    // aggregate node, a base column (non-aggregated blocks), or an
    // arithmetic expression over aggregate results (q8/q14's SUM ratios).
    enum Source { GROUP = 0; AGG = 1; COLUMN = 2; EXPR = 3; }
    Source source = 1;
    uint32 ordinal = 2;      // GROUP: group_columns idx; AGG: aggs idx
    QbColumnRef column = 3;  // COLUMN source
    // EXPR: arithmetic FilterExpr where COLUMN_REF ordinals address the
    // stage-1 value layout [group columns..., aggregates...]. OP_DIV uses
    // MySQL decimal division (scale = arg scale + 4, round half-even per
    // my_decimal — validated by the md5 gates), then the result is rounded
    // to `result_scale`.
    FilterExpr expr = 4;
    uint32 result_scale = 5;
}

message TxExecuteQueryBlock {
    message TableDesc {
        string table_name = 1;
    }
    message Request {
        repeated TableDesc tables = 1;
        repeated QbNode nodes = 2;   // topological order; last node = root
        repeated QbOutputExpr output = 3;
        repeated QbSortKey order_by = 4;
        uint64 limit = 5;            // 0 = no limit
        uint64 offset = 6;
    }
    message Response {
        bool ok = 1;
        string error = 2;
        repeated bytes rows = 3;     // proxy row format, output order
    }
}

// Predicate pushdown: recursive expression tree for server-side row filtering.
// Server evaluates this during Scan and skips non-matching rows.
// MySQL still re-evaluates all conditions (cond_push returns original cond).
message FilterExpr {
    enum Op {
        CONST_INT = 0; CONST_UINT = 1; CONST_DOUBLE = 2;
        CONST_STRING = 3; CONST_NULL = 4; COLUMN_REF = 5;
        OP_EQ = 10; OP_NE = 11; OP_LT = 12; OP_LE = 13;
        OP_GT = 14; OP_GE = 15;
        OP_AND = 20; OP_OR = 21; OP_NOT = 22;
        OP_BETWEEN = 30; OP_IN = 31; OP_LIKE = 32;
        OP_IS_NULL = 33; OP_IS_NOT_NULL = 34;
        // Arithmetic for aggregate-argument expressions. Decimal arithmetic is
        // evaluated server-side in exact (mantissa, scale) integer form.
        OP_ADD = 40; OP_SUB = 41; OP_MUL = 42; OP_DIV = 43; OP_NEG = 44;
    }
    Op op = 1;
    int64 int_val = 2;
    uint64 uint_val = 3;
    double double_val = 4;
    bytes string_val = 5;
    uint32 column_index = 6;  // 0-based (COLUMN_REF用)
    uint32 compare_type = 7;  // 0=SIGNED_INT, 1=UNSIGNED_INT, 2=DOUBLE, 3=STRING
    repeated FilterExpr children = 8;
    bool negated = 9;         // BETWEEN, IN用
}

message PushedPredicate {
    FilterExpr expr = 1;
    uint32 num_columns = 2;
}

// Aggregation pushdown. When attached to a scan step, the server groups the
// post-filter rows and returns one synthetic row per group. Each group row uses
// the normal row format: group columns first, then (value, count) per aggregate.
//   COUNT: value=row count (count col unused)
//   SUM:   value=exact decimal sum as ASCII (null/empty if 0 non-null), count=non-null count
//   AVG:   value=exact decimal sum as ASCII, count=non-null count (proxy divides)
// The proxy decodes positionally from the spec it built.
message AggFunc {
    enum Kind { AGG_COUNT = 0; AGG_SUM = 1; AGG_AVG = 2; }
    Kind kind = 1;
    FilterExpr arg = 2;        // argument expression (absent for COUNT(*))
    uint32 result_scale = 3;   // decimal scale of the per-row arg value
}
message AggregateSpec {
    uint32 num_columns = 1;                            // table->s->fields (row parse)
    repeated uint32 group_columns = 2 [packed = true]; // 0-based field indices (GROUP BY)
    repeated AggFunc aggs = 3;
}
