syntax = "proto3";

package LineairDB.Protocol;

// Identifies which RPC is being invoked.
enum OpCode {
    UNKNOWN = 0;

    // Transaction lifecycle
    TX_BEGIN_TRANSACTION = 1;
    TX_ABORT = 2;

    // Primary key operations
    TX_READ = 3;
    TX_WRITE = 4;
    TX_DELETE = 5;

    // Secondary index operations
    TX_READ_SECONDARY_INDEX = 6;
    TX_WRITE_SECONDARY_INDEX = 7;
    TX_DELETE_SECONDARY_INDEX = 8;
    TX_UPDATE_SECONDARY_INDEX = 9;

    // Primary key scan operations
    TX_GET_MATCHING_KEYS_IN_RANGE = 10;
    TX_GET_MATCHING_KEYS_AND_VALUES_IN_RANGE = 11;
    TX_GET_MATCHING_KEYS_AND_VALUES_FROM_PREFIX = 12;
    TX_FETCH_LAST_KEY_IN_RANGE = 13;
    TX_FETCH_FIRST_KEY_WITH_PREFIX = 14;
    TX_FETCH_NEXT_KEY_WITH_PREFIX = 15;

    // Secondary index scan operations
    TX_GET_MATCHING_PRIMARY_KEYS_IN_RANGE = 16;
    TX_GET_MATCHING_PRIMARY_KEYS_FROM_PREFIX = 17;
    TX_FETCH_LAST_PRIMARY_KEY_IN_SECONDARY_RANGE = 18;
    TX_FETCH_LAST_SECONDARY_ENTRY_IN_RANGE = 19;

    // Database operations
    DB_FENCE = 20;
    DB_END_TRANSACTION = 21;
    DB_CREATE_TABLE = 22;
    DB_SET_TABLE = 23;
    DB_CREATE_SECONDARY_INDEX = 24;

    // Batch operations
    TX_BATCH_READ = 25;
    TX_BATCH_WRITE = 26;

    // Experimental prefetch operations
    TX_STATELESS_READ = 27;
    TX_STATELESS_BATCH_READ = 28;
    TX_VALIDATE_AND_COMMIT = 29;
    TX_EXECUTE_READ_PLAN = 30;
    TX_GET_TABLE_STATS = 31;

    // Executes a resolved-statement request on the server's embedded DuckDB
    // executor, which reads PAX storage in place.
    TX_EXECUTE_DUCKDB_QUERY = 36;
}

enum BatchOpType {
    BATCH_OP_UNKNOWN = 0;
    BATCH_OP_WRITE = 1;
    BATCH_OP_DELETE = 2;
    BATCH_OP_SECONDARY_INDEX_WRITE = 3;
    BATCH_OP_SECONDARY_INDEX_DELETE = 4;
    // Write that requires the key to be free; the server refuses it otherwise.
    BATCH_OP_INSERT = 5;
}

// Why the server refused a transaction, where the query layer has to tell the
// cause apart from ordinary contention.
enum AbortReason {
    ABORT_REASON_UNSPECIFIED = 0;
    ABORT_REASON_DUPLICATE_PRIMARY_KEY = 1;
}

// Shared key-value pair used across scan responses.
message KeyValue {
    bytes key = 1;
    bytes value = 2;
}

// Range read observed by a stateless scan. The commit re-runs the scan
// described by the bounds and asserts the observed key set is unchanged.
message RangeReadEntry {
    string table_name = 1;
    string index_name = 2; // Empty means primary index.
    bytes start_key = 3;
    bytes end_key = 4;
    uint64 row_limit = 5; // 0 means compare the whole range.
    bool reverse_scan = 6;
    repeated bytes result_keys = 7; // PK scan: primary keys. SI scan: secondary keys.
    repeated bytes result_primary_keys = 8; // SI scan only.
}

// Secondary index entry: a secondary key and its associated primary keys.
message SecondaryIndexEntry {
    bytes secondary_key = 1;
    repeated bytes primary_keys = 2;
}

// Begin a new transaction. Returns a server-assigned transaction ID.
// Response includes current row counts for all tables so proxies can
// feed accurate cardinalities to the MySQL optimizer.
message TxBeginTransaction {
    message Request {}
    message Response {
        int64 transaction_id = 1;
        repeated TableRowCount table_stats = 2;
    }
}

// Fetch optimizer stats before the proxy opens a LineairDB transaction.
message GetTableStats {
    message IndexDesc {
        string index_name = 1; // Empty means primary index.
        uint32 num_key_parts = 2; // Number of leading key parts to measure.
    }
    message Request {
        string ndv_table = 1; // Table to compute NDV for; empty means row counts only.
        repeated IndexDesc ndv_indexes = 2;
        bool ndv_force_recompute = 3; // ANALYZE TABLE forces NDV recomputation.
    }
    // NDV (Number of Distinct Values) per key-prefix length.
    message IndexNdv {
        string index_name = 1;
        bool available = 2; // False when NDV is unavailable for this index.
        repeated uint64 ndv = 3;
        // Leading-key range histogram. bounds[i] is a raw encoded leading-key
        // boundary; cum[i] is the cumulative live-row count up to that bound.
        repeated bytes hist_bounds = 4;
        repeated uint64 hist_cum = 5;
        bool hist_available = 6;
    }
    message Response {
        repeated TableRowCount table_stats = 1;
        repeated IndexNdv index_ndv = 2;
    }
}

// Abort a transaction.
message TxAbort {
    message Request {
        int64 transaction_id = 1;
    }
    message Response {}
}

// Read multiple values by primary key in a single round-trip.
// Used by MRR (Multi-Range Read) to batch JOIN lookups.
message TxBatchRead {
    message Request {
        int64 transaction_id = 1;
        repeated bytes keys = 2;
        string table_name = 3;
    }
    message ReadResult {
        bool found = 1;
        bytes value = 2;
    }
    message Response {
        repeated ReadResult results = 1;
        bool is_aborted = 2;
    }
}

// Flush writes and deletes in the same order MySQL issued them.
message TxBatchWrite {
    message BatchOp {
        BatchOpType type = 1;
        bytes key = 2;
        bytes value = 3;
        string index_name = 4;
        bytes secondary_key = 5;
        bytes primary_key = 6;
        string table_name = 7;
    }
    message Request {
        int64 transaction_id = 1;
        string table_name = 2;
        // Operations are applied in the same order as MySQL issued them.
        repeated BatchOp ops = 3;
    }
    message Response {
        bool success = 1;
        bool is_aborted = 2;
        AbortReason abort_reason = 3;
    }
}

// Read a primary-key value without opening a server-side transaction.
// The returned TID is validated later by TxValidateAndCommit.
message TxStatelessRead {
    message Request {
        string table_name = 1;
        bytes key = 2;
    }
    message Response {
        bool found = 1;
        bytes value = 2;
        uint64 tid = 3;
    }
}

// Read multiple primary-key values without opening a server-side transaction.
message TxStatelessBatchRead {
    message ReadOp {
        string table_name = 1;
        bytes key = 2;
    }
    message Request {
        repeated ReadOp ops = 1;
    }
    message ReadResult {
        bool found = 1;
        bytes value = 2;
        uint64 tid = 3;
    }
    message Response {
        repeated ReadResult results = 1;
    }
}

// Execute a dependent read plan in one RPC.
// Steps may read values produced by earlier steps to build later keys.
message TxExecuteReadPlan {
    message KeyBinding {
        uint32 source_step = 1;
        uint32 source_row = 2;
        uint32 source_offset = 3;
        uint32 source_length = 4; // 0 means the rest of the source bytes.
        bool use_midpoint = 5;
        bool from_key = 6;
        int32 source_column = 7; // 1-based row column; 0 means disabled.
        bool column_as_int_key = 8;
        int64 int_delta = 9;
    }
    message PlanStep {
        string table_name = 1;
        bytes key_prefix = 2;
        bytes end_key_prefix = 3;
        bool is_scan = 4;
        uint64 scan_limit = 5; // 0 means no limit.
        string index_name = 6; // Empty means primary index.
        repeated KeyBinding bindings = 7;
        repeated KeyBinding end_bindings = 8;
        bool for_each = 9;
        bool reverse_scan = 10;
        PushedPredicate filter = 11; // Optional row filter for staged scans.
        // Optional column subset for staged rows. The server keeps full null
        // flags, sends only listed column values, and filters before trimming.
        RowProjection projection = 12;
        // Optional membership reduction for high-fanout join probes.
        repeated SemijoinFilter semijoins = 13;
        // Anti-join probe: only the existence of a match matters, never the
        // inner rows. Emit at most one row per probe key. A complete answer,
        // not a truncated window -- index_next still reports a clean EOF.
        bool existence_only = 14;
    }
    // Drop probe rows whose join key is absent from an earlier step's result.
    // Columns are 0-based TABLE::field[] ordinals.
    message SemijoinFilter {
        uint32 source_step = 1;
        uint32 source_column = 2;
        uint32 probe_column = 3;
        // Optional filter applied while building the source membership set.
        PushedPredicate source_filter = 4;
    }
    message RowProjection {
        uint32 num_columns = 1; // table->s->fields
        repeated uint32 field_indexes = 2 [packed = true]; // 0-based, sorted.
    }
    message StepResult {
        bool found = 1;
        bytes value = 2;
        uint64 tid = 3;
        bytes actual_key = 4;
        repeated bytes scan_keys = 5;
        repeated bytes scan_values = 6;
        repeated uint64 scan_tids = 7;
        repeated bytes secondary_keys = 8;
        bytes actual_start_key = 9;
        bytes actual_end_key = 10;
        // for_each range probes return one group per deduplicated start key.
        // group_sizes[i] rows belong to [group_start_keys[i], group_end_keys[i]).
        repeated uint32 group_sizes = 11;
        repeated bytes group_start_keys = 12;
        repeated bytes group_end_keys = 13;
        // Primary keys rejected by the pushed scan filter. The proxy records
        // them as negative row-cache entries for later point probes.
        repeated bytes filtered_keys = 14;
    }
    message Request {
        repeated PlanStep steps = 1;
    }
    message Response {
        repeated StepResult results = 1;
        bool ok = 2;
    }
}

// Validate stateless reads and install buffered writes in one RPC.
message TxValidateAndCommit {
    message ReadEntry {
        string table_name = 1;
        bytes key = 2;
        uint64 tid = 3;
        bool found = 4;
    }
    message WriteEntry {
        string table_name = 1;
        bytes key = 2;
        bytes value = 3;
        bool is_delete = 4;
        bool is_insert = 5; // Commit refuses the entry if the key holds a row.
    }
    message DeleteEntry {
        string table_name = 1;
        bytes key = 2;
    }
    message SecondaryIndexEntry {
        string table_name = 1;
        string index_name = 2;
        bytes secondary_key = 3;
        bytes primary_key = 4;
        bool is_delete = 5;
    }
    message Request {
        repeated ReadEntry reads = 1;
        repeated WriteEntry writes = 2;
        repeated DeleteEntry deletes = 3;
        repeated SecondaryIndexEntry secondary_index_ops = 4;
        repeated TableRowDelta row_deltas = 5;
        bool fence = 6;
        repeated RangeReadEntry range_reads = 7;
    }
    message Response {
        bool committed = 1;
        repeated TableRowCount table_stats = 2;
        string abort_detail = 3; // Free-form cause, for tracing only.
        AbortReason abort_reason = 4;
    }
}

// Read a single value by primary key.
message TxRead {
    message Request {
        int64 transaction_id = 1;
        bytes key = 2;
        string table_name = 4;
    }
    message Response {
        bool found = 1;
        bytes value = 2;
        bool is_aborted = 3;
    }
}

// Write a value by primary key.
message TxWrite {
    message Request {
        int64 transaction_id = 1;
        bytes key = 2;
        bytes value = 3;
        string table_name = 5;
    }
    message Response {
        bool success = 1;
        bool is_aborted = 2;
    }
}

// Wait for all pending transactions to be durably committed.
message DbFence {
    message Request {}
    message Response {}
}

// Row-count delta reported by proxy on commit (piggybacked on EndTransaction).
message TableRowDelta {
    string table_name = 1;
    int64 delta = 2;
}

// Snapshot of a single table's row count, returned by server in BEGIN/END.
message TableRowCount {
    string table_name = 1;
    int64 row_count = 2;
}

// Commit or abort a transaction.
// @param fence  If true, block until the transaction is durably committed.
// @param row_deltas  Row-count changes accumulated during this transaction.
//   Server applies these only on successful commit and returns updated
//   table_stats in the response for the proxy's next transaction.
message DbEndTransaction {
    message Request {
        int64 transaction_id = 1;
        bool fence = 2;
        repeated TableRowDelta row_deltas = 3;
    }
    message Response {
        bool is_aborted = 1;
        repeated TableRowCount table_stats = 2;
        AbortReason abort_reason = 3;
    }
}

// Delete a value by primary key.
message TxDelete {
    message Request {
        int64 transaction_id = 1;
        bytes key = 2;
        string table_name = 4;
    }
    message Response {
        bool success = 1;
        bool is_aborted = 2;
    }
}

// Read primary-key values associated with a secondary key.
// @see LineairDBTransaction::read_secondary_index()
message TxReadSecondaryIndex {
    message Request {
        int64 transaction_id = 1;
        string index_name = 2;
        bytes secondary_key = 3;
        string table_name = 4;
    }
    message Response {
        repeated bytes values = 1;
        bool is_aborted = 2;
    }
}

// Write a primary-key entry into a secondary index.
// @see LineairDBTransaction::write_secondary_index()
message TxWriteSecondaryIndex {
    message Request {
        int64 transaction_id = 1;
        string index_name = 2;
        bytes secondary_key = 3;
        bytes primary_key = 4;
        string table_name = 5;
    }
    message Response {
        bool success = 1;
        bool is_aborted = 2;
    }
}

// Remove a primary-key entry from a secondary index.
// @see LineairDBTransaction::delete_secondary_index()
message TxDeleteSecondaryIndex {
    message Request {
        int64 transaction_id = 1;
        string index_name = 2;
        bytes secondary_key = 3;
        bytes primary_key = 4;
        string table_name = 5;
    }
    message Response {
        bool success = 1;
        bool is_aborted = 2;
    }
}

// Atomically move a primary key from one secondary key to another.
// @see LineairDBTransaction::update_secondary_index()
message TxUpdateSecondaryIndex {
    message Request {
        int64 transaction_id = 1;
        string index_name = 2;
        bytes old_secondary_key = 3;
        bytes new_secondary_key = 4;
        bytes primary_key = 5;
        string table_name = 6;
    }
    message Response {
        bool success = 1;
        bool is_aborted = 2;
    }
}

// Create a new table in the database.
// @see LineairDB::Database::CreateTable()
message DbCreateTable {
    message Request {
        string table_name = 1;
        // PAX storage cell widths per encoded row field. Entry 0 is the
        // null-flags field; later entries follow TABLE::field order. Empty
        // means the table uses the ordinary row layout. Proxies may send this
        // unconditionally because the server enables it only under its PAX
        // storage gate.
        repeated uint32 pax_field_max_bytes = 2 [packed = true];
        // PAX typed cells: per-field storage kind, one entry per
        // pax_field_max_bytes entry (index 0 = null-flags field). Values match
        // LineairDB::Pax::FieldKind (0=UNTYPED, 1=INT32, 2=INT64, 3=DATE,
        // 4=DEC64). Empty or length-mismatched => every field UNTYPED (the
        // untyped byte layout). The server additionally gates typed install on
        // HELIOS_PAX_TYPED (default on); proxies may always send this.
        repeated uint32 pax_field_kind = 3 [packed = true];
        // DECIMAL scale per field for FK_DEC64 (else 0). Same length as
        // pax_field_kind when present.
        repeated int32 pax_field_scale = 4 [packed = true];
    }
    message Response {
        bool success = 1;
    }
}

// Set the table context for a transaction. Subsequent operations
// within this transaction will be scoped to the specified table.
// @see LineairDB::Transaction::SetTable()
message DbSetTable {
    message Request {
        int64 transaction_id = 1;
        string table_name = 2;
    }
    message Response {
        bool success = 1;
    }
}

// Create a secondary index on a table.
// @see LineairDB::Database::CreateSecondaryIndex()
// @param index_type  0=kNone, 2=kDictUnique (LineairDB::Index::SecondaryIndexType)
message DbCreateSecondaryIndex {
    message Request {
        string table_name = 1;
        string index_name = 2;
        uint32 index_type = 3;
    }
    message Response {
        bool success = 1;
    }
}

// Scan keys in [start_key, end_key) range.
// @see LineairDBTransaction::get_matching_keys_in_range()
message TxGetMatchingKeysInRange {
    message Request {
        int64 transaction_id = 1;
        bytes start_key = 2;
        bytes end_key = 3;
        string table_name = 5;
    }
    message Response {
        repeated bytes keys = 1;
        bool is_aborted = 2;
    }
}

// Scan key-value pairs in [start_key, end_key) range.
// Skips tombstones (null/zero-length values).
// @see LineairDBTransaction::get_matching_keys_and_values_in_range()
message TxGetMatchingKeysAndValuesInRange {
    message Request {
        int64 transaction_id = 1;
        bytes start_key = 2;
        bytes end_key = 3;
        PushedPredicate filter = 5;
        string table_name = 6;
        uint64 row_limit = 7; // 0 means no limit.
        bool reverse_scan = 8; // true means scan in descending key order.
    }
    message Response {
        repeated KeyValue results = 1;
        bool is_aborted = 2;
    }
}

// Scan key-value pairs matching a prefix.
// Skips tombstones (null/zero-length values).
// @see LineairDBTransaction::get_matching_keys_and_values_from_prefix()
message TxGetMatchingKeysAndValuesFromPrefix {
    message Request {
        int64 transaction_id = 1;
        bytes prefix = 2;
        PushedPredicate filter = 3;
        string table_name = 4;
    }
    message Response {
        repeated KeyValue results = 1;
        bool is_aborted = 2;
    }
}

// Reverse scan to find the last key in [start_key, end_key) range.
// @see LineairDBTransaction::fetch_last_key_in_range()
message TxFetchLastKeyInRange {
    message Request {
        int64 transaction_id = 1;
        bytes start_key = 2;
        bytes end_key = 3;
        string table_name = 5;
    }
    message Response {
        bool found = 1;
        bytes key = 2;
        bool is_aborted = 3;
    }
}

// Find the first non-tombstone key in [prefix, prefix_end) range.
// @see LineairDBTransaction::fetch_first_key_with_prefix()
message TxFetchFirstKeyWithPrefix {
    message Request {
        int64 transaction_id = 1;
        bytes prefix = 2;
        bytes prefix_end = 3;
        string table_name = 4;
    }
    message Response {
        bool found = 1;
        bytes key = 2;
        bool is_aborted = 3;
    }
}

// Find the next non-tombstone key after last_key in [last_key, prefix_end) range.
// @see LineairDBTransaction::fetch_next_key_with_prefix()
message TxFetchNextKeyWithPrefix {
    message Request {
        int64 transaction_id = 1;
        bytes last_key = 2;
        bytes prefix_end = 3;
        string table_name = 4;
    }
    message Response {
        bool found = 1;
        bytes key = 2;
        bool is_aborted = 3;
    }
}

// Scan primary keys from a secondary index in [start_key, end_key) range.
// @see LineairDBTransaction::get_matching_primary_keys_in_range()
message TxGetMatchingPrimaryKeysInRange {
    message Request {
        int64 transaction_id = 1;
        string index_name = 2;
        bytes start_key = 3;
        bytes end_key = 4;
        string table_name = 6;
    }
    message Response {
        repeated bytes primary_keys = 1;
        bool is_aborted = 2;
    }
}

// Scan primary keys from a secondary index matching a prefix.
// @see LineairDBTransaction::get_matching_primary_keys_from_prefix()
message TxGetMatchingPrimaryKeysFromPrefix {
    message Request {
        int64 transaction_id = 1;
        string index_name = 2;
        bytes prefix = 3;
        string table_name = 4;
    }
    message Response {
        repeated bytes primary_keys = 1;
        bool is_aborted = 2;
    }
}

// Reverse scan to find the last primary key in a secondary index range
// [start_key, end_key).
// @see LineairDBTransaction::fetch_last_primary_key_in_secondary_range()
message TxFetchLastPrimaryKeyInSecondaryRange {
    message Request {
        int64 transaction_id = 1;
        string index_name = 2;
        bytes start_key = 3;
        bytes end_key = 4;
        string table_name = 6;
    }
    message Response {
        bool found = 1;
        bytes primary_key = 2;
        bool is_aborted = 3;
    }
}

// Reverse scan to find the last secondary index entry (secondary key + primary keys)
// in [start_key, end_key) range.
// @see LineairDBTransaction::fetch_last_secondary_entry_in_range()
message TxFetchLastSecondaryEntryInRange {
    message Request {
        int64 transaction_id = 1;
        string index_name = 2;
        bytes start_key = 3;
        bytes end_key = 4;
        string table_name = 6;
    }
    message Response {
        bool found = 1;
        SecondaryIndexEntry entry = 2;
        bool is_aborted = 3;
    }
}

// Predicate pushdown: recursive expression tree for server-side row filtering.
// Server evaluates this during Scan and skips non-matching rows.
// MySQL still re-evaluates all conditions (cond_push returns original cond).
message FilterExpr {
    enum Op {
        CONST_INT = 0; CONST_UINT = 1; CONST_DOUBLE = 2;
        CONST_STRING = 3; CONST_NULL = 4; COLUMN_REF = 5;
        OP_EQ = 10; OP_NE = 11; OP_LT = 12; OP_LE = 13;
        OP_GT = 14; OP_GE = 15;
        OP_AND = 20; OP_OR = 21; OP_NOT = 22;
        OP_BETWEEN = 30; OP_IN = 31; OP_LIKE = 32;
        OP_IS_NULL = 33; OP_IS_NOT_NULL = 34;
    }
    Op op = 1;
    int64 int_val = 2;
    uint64 uint_val = 3;
    double double_val = 4;
    bytes string_val = 5;
    uint32 column_index = 6;  // 0-based (COLUMN_REF用)
    uint32 compare_type = 7;  // 0=SIGNED_INT, 1=UNSIGNED_INT, 2=DOUBLE, 3=STRING
    repeated FilterExpr children = 8;
    bool negated = 9;         // BETWEEN, IN用
}

message PushedPredicate {
    FilterExpr expr = 1;
    uint32 num_columns = 2;
}

// DuckDB bridge. The proxy encodes MySQL's resolved statement
// (Query_block + Item trees, captured after resolution and before
// optimization) and the server constructs DuckDB's parsed AST from it.
// No SQL text crosses the wire, so the object validated on the proxy is the
// object executed. Every oneof is default-deny on both sides: a node the
// serializer has no rule for is never emitted, and a node the server does
// not recognize fails the request.
message TxExecuteDuckdbQuery {
    enum TypeKind {
        TYPE_UNSPECIFIED = 0;
        INT64 = 1;
        DECIMAL = 2;   // DEC64: at most 15 significant digits
        VARCHAR = 3;
        DATE = 4;
        DATETIME = 5;
        BOOL = 6;
    }

    message ResolvedType {
        TypeKind kind = 1;
        bool nullable = 2;
        uint32 precision = 3;    // DECIMAL only
        uint32 scale = 4;        // DECIMAL only
        uint32 collation_id = 5; // VARCHAR only; MySQL collation number
    }

    message DecimalLit {
        sint64 unscaled = 1;
        uint32 scale = 2;
    }
    message DateLit {
        int32 year = 1;
        uint32 month = 2;
        uint32 day = 3;
    }
    message DatetimeLit {
        DateLit date = 1;
        uint32 hour = 2;
        uint32 minute = 3;
        uint32 second = 4;
        uint32 microsecond = 5;
    }
    message Literal {
        oneof value {
            int64 int_value = 1;
            DecimalLit decimal_value = 2;
            bytes string_value = 3;
            DateLit date_value = 4;
            DatetimeLit datetime_value = 5;
            bool bool_value = 6;
            bool null_value = 7; // set true; typed by Expr.result_type
        }
    }

    // relation_id is unique across the whole request, subqueries included,
    // so a correlated reference names its defining relation directly.
    message ColumnRef {
        uint32 relation_id = 1;
        uint32 column_ordinal = 2; // TABLE::field[] order for a base table;
                                   // select-list position for a derived one
    }

    message Logical {
        enum Op {
            OP_UNSPECIFIED = 0;
            AND = 1;
            OR = 2;
        }
        Op op = 1;
        repeated Expr args = 2;
    }
    message Not {
        Expr arg = 1;
    }
    message IsNullTest {
        Expr arg = 1;
        bool negated = 2;
    }
    message Comparison {
        enum Op {
            OP_UNSPECIFIED = 0;
            EQ = 1;
            NE = 2;
            LT = 3;
            LE = 4;
            GT = 5;
            GE = 6;
        }
        Op op = 1;
        Expr left = 2;
        Expr right = 3;
        // The type MySQL resolved the comparison under. The server inserts
        // casts so DuckDB compares under the same type instead of inferring.
        ResolvedType compare_as = 4;
    }
    message Arithmetic {
        enum Op {
            OP_UNSPECIFIED = 0;
            ADD = 1;
            SUB = 2;
            MUL = 3;
            DIV = 4;
            MOD = 5;
        }
        Op op = 1;
        Expr left = 2;
        Expr right = 3;
        ResolvedType result_as = 4;
    }
    message Between {
        Expr value = 1;
        Expr low = 2;
        Expr high = 3;
        bool negated = 4;
        ResolvedType compare_as = 5;
    }
    message InList {
        Expr value = 1;
        repeated Expr list = 2;
        bool negated = 3;
    }
    message CaseWhen {
        message Branch {
            Expr when = 1;
            Expr then = 2;
        }
        repeated Branch branches = 1;
        Expr else_result = 2;
    }
    message FunctionCall {
        enum Fn {
            FN_UNSPECIFIED = 0;
            EXTRACT_YEAR = 1;
            SUBSTRING = 2;
            ASCII = 3;
        }
        Fn fn = 1;
        repeated Expr args = 2;
    }
    message Aggregate {
        enum Kind {
            KIND_UNSPECIFIED = 0;
            COUNT_STAR = 1;
            COUNT = 2;
            SUM = 3;
            AVG = 4;
            MIN = 5;
            MAX = 6;
        }
        Kind kind = 1;
        Expr arg = 2; // absent for COUNT_STAR
        bool distinct = 3;
    }
    message LikePred {
        Expr value = 1;
        Expr pattern = 2;
        sint32 escape = 3;
        bool negated = 4;
        uint32 collation_id = 5;
    }
    message Subquery {
        enum Kind {
            KIND_UNSPECIFIED = 0;
            SCALAR = 1;
            EXISTS = 2;
            IN = 3;
        }
        Kind kind = 1;
        QueryBlock query = 2;
        Expr left = 3; // IN only
        bool negated = 4;
    }
    message CastExpr {
        Expr arg = 1;
        ResolvedType to = 2;
    }

    message Expr {
        ResolvedType result_type = 1;
        oneof node {
            Literal literal = 10;
            ColumnRef column = 11;
            Logical logical = 12;
            Not not = 13;
            IsNullTest is_null = 14;
            Comparison comparison = 15;
            Arithmetic arithmetic = 16;
            Between between = 17;
            InList in_list = 18;
            CaseWhen case_when = 19;
            FunctionCall function = 20;
            Aggregate aggregate = 21;
            LikePred like = 22;
            Subquery subquery = 23;
            CastExpr cast = 24;
        }
    }

    message BaseTable {
        uint32 relation_id = 1;
        uint32 table_desc_index = 2; // into Request.tables
    }
    message DerivedTable {
        uint32 relation_id = 1;
        QueryBlock query = 2;
    }
    message JoinRel {
        enum Kind {
            KIND_UNSPECIFIED = 0;
            INNER = 1;
            LEFT = 2;
            CROSS = 3;
            SEMI = 4;
            ANTI = 5;
        }
        Kind kind = 1;
        Relation left = 2;
        Relation right = 3;
        Expr condition = 4; // absent for CROSS
    }
    message Relation {
        oneof node {
            BaseTable base = 1;
            DerivedTable derived = 2;
            JoinRel join = 3;
        }
    }

    message SelectItem {
        Expr expression = 1;
    }
    message OrderKey {
        Expr expression = 1;
        bool descending = 2;
        bool nulls_first = 3;
    }
    message QueryBlock {
        Relation from = 1;
        repeated SelectItem select = 2;
        Expr where = 3;
        repeated Expr group_by = 4;
        Expr having = 5;
        repeated OrderKey order_by = 6;
        bool distinct = 7;
        optional uint64 limit = 8;  // absent means no LIMIT
        optional uint64 offset = 9; // absent means no OFFSET
    }

    // Mirrors LineairDB::Pax::FieldKind (pax_store.h): 0=UNTYPED, 1=INT32,
    // 2=INT64, 3=DATE, 4=DEC64.
    message ColumnDesc {
        uint32 pax_kind = 1;
        uint32 pax_width = 2;    // PAX cell payload width (bytes)
        int32 pax_scale = 3;     // FK_DEC64 only
    }
    // The server persists no schema; each request carries per-table PAX cell
    // metadata derived from TABLE::field[] and validated against the store.
    message TableDesc {
        string table_name = 1;             // PaxStore lookup key
                                           // (TABLE_SHARE::normalized_path)
        repeated ColumnDesc columns = 2;   // TABLE::field[] order
    }

    message Request {
        uint32 format_version = 1; // exact match required
        repeated TableDesc tables = 2;
        QueryBlock root = 3;
        uint32 expected_output_count = 4;
    }
    message Response {
        bool ok = 1;
        string error = 2;
        repeated bytes rows = 3; // proxy row format, DuckDB result order
    }
}
