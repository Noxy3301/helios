syntax = "proto3";

package LineairDB.Protocol;

// Identifies which RPC is being invoked.
enum OpCode {
    UNKNOWN = 0;

    // Transaction lifecycle
    TX_BEGIN_TRANSACTION = 1;
    TX_ABORT = 2;

    // Primary key operations
    TX_READ = 3;
    TX_WRITE = 4;
    TX_DELETE = 5;

    // Secondary index operations
    TX_READ_SECONDARY_INDEX = 6;
    TX_WRITE_SECONDARY_INDEX = 7;
    TX_DELETE_SECONDARY_INDEX = 8;
    TX_UPDATE_SECONDARY_INDEX = 9;

    // Primary key scan operations
    TX_GET_MATCHING_KEYS_IN_RANGE = 10;
    TX_GET_MATCHING_KEYS_AND_VALUES_IN_RANGE = 11;
    TX_GET_MATCHING_KEYS_AND_VALUES_FROM_PREFIX = 12;
    TX_FETCH_LAST_KEY_IN_RANGE = 13;
    TX_FETCH_FIRST_KEY_WITH_PREFIX = 14;
    TX_FETCH_NEXT_KEY_WITH_PREFIX = 15;

    // Secondary index scan operations
    TX_GET_MATCHING_PRIMARY_KEYS_IN_RANGE = 16;
    TX_GET_MATCHING_PRIMARY_KEYS_FROM_PREFIX = 17;
    TX_FETCH_LAST_PRIMARY_KEY_IN_SECONDARY_RANGE = 18;
    TX_FETCH_LAST_SECONDARY_ENTRY_IN_RANGE = 19;

    // Database operations
    DB_FENCE = 20;
    DB_END_TRANSACTION = 21;
    DB_CREATE_TABLE = 22;
    DB_SET_TABLE = 23;
    DB_CREATE_SECONDARY_INDEX = 24;

    // Batch operations
    TX_BATCH_READ = 25;
    TX_BATCH_WRITE = 26;

    // Experimental prefetch operations
    TX_STATELESS_READ = 27;
    TX_STATELESS_BATCH_READ = 28;
    TX_VALIDATE_AND_COMMIT = 29;
    TX_STATELESS_RANGE_SCAN = 30;
    TX_STATELESS_SECONDARY_RANGE_SCAN = 31;
    TX_EXECUTE_READ_PLAN = 32;
}

enum BatchOpType {
    BATCH_OP_UNKNOWN = 0;
    BATCH_OP_WRITE = 1;
    BATCH_OP_DELETE = 2;
    BATCH_OP_SECONDARY_INDEX_WRITE = 3;
    BATCH_OP_SECONDARY_INDEX_DELETE = 4;
}

// Shared key-value pair used across scan responses.
message KeyValue {
    bytes key = 1;
    bytes value = 2;
}

// Range read observed by a stateless scan. The commit re-runs the scan
// described by the bounds and asserts the observed key set is unchanged.
message RangeReadEntry {
    string table_name = 1;
    string index_name = 2; // Empty means primary index.
    bytes start_key = 3;
    bytes end_key = 4;
    uint64 row_limit = 5; // 0 means compare the whole range.
    bool reverse_scan = 6;
    repeated bytes result_keys = 7; // PK scan: primary keys. SI scan: secondary keys.
    repeated bytes result_primary_keys = 8; // SI scan only.
}

// Secondary index entry: a secondary key and its associated primary keys.
message SecondaryIndexEntry {
    bytes secondary_key = 1;
    repeated bytes primary_keys = 2;
}

// Begin a new transaction. Returns a server-assigned transaction ID.
// Response includes current row counts for all tables so proxies can
// feed accurate cardinalities to the MySQL optimizer.
message TxBeginTransaction {
    message Request {}
    message Response {
        int64 transaction_id = 1;
        repeated TableRowCount table_stats = 2;
    }
}

// Standalone, transaction-less fetch of all table row counts. Lets the proxy
// seed the MySQL optimizer with accurate cardinalities WITHOUT beginning a
// transaction — required because oneshot defers tx_begin past the optimizer's
// info() call, so the begin/end table_stats piggyback misses cold-start plans.
message GetTableStats {
    // Optional per-index NDV request (Phase 2). If ndv_table is set, the server
    // ALSO computes the number-of-distinct-values per key-part prefix for each
    // listed index (exact, one ordered live-row pass), so the proxy can set
    // accurate rec_per_key instead of the n-th-root heuristic. The proxy passes
    // num_key_parts (the SECONDARY user key-parts; PK is not appended today).
    message IndexDesc {
        string index_name = 1;     // "" = primary index
        uint32 num_key_parts = 2;
    }
    message Request {
        string ndv_table = 1;
        repeated IndexDesc ndv_indexes = 2;
        bool ndv_force_recompute = 3;  // ANALYZE TABLE: bust the server NDV cache
    }
    // Per-index NDV result. available=false => a key-part type the server can't
    // parse (e.g. string); the proxy keeps its heuristic for that index rather
    // than trusting bad stats. ndv[k] = distinct values of prefix (parts 0..k).
    message IndexNdv {
        string index_name = 1;
        bool available = 2;
        repeated uint64 ndv = 3;
        // Phase-22 range cardinality: per-index equi-depth boundary histogram on the
        // LEADING key part (proxy records_in_range range estimate). Independent of
        // `available` (NDV) above. hist_bounds[i] = raw stored leading-part-prefix key
        // (byte-identical to convert_key_to_ldbformat); hist_cum[i] = cumulative live
        // rows with leading-part <= bound[i] (monotone; last == total). Empty/absent =>
        // proxy keeps its 5%/10% heuristic (fail-closed).
        repeated bytes hist_bounds = 4;
        repeated uint64 hist_cum = 5;
        bool hist_available = 6;
    }
    message Response {
        repeated TableRowCount table_stats = 1;
        repeated IndexNdv index_ndv = 2;
    }
}

// Abort a transaction.
message TxAbort {
    message Request {
        int64 transaction_id = 1;
    }
    message Response {}
}

// Read multiple values by primary key in a single round-trip.
// Used by MRR (Multi-Range Read) to batch JOIN lookups.
message TxBatchRead {
    message Request {
        int64 transaction_id = 1;
        repeated bytes keys = 2;
        string table_name = 3;
    }
    message ReadResult {
        bool found = 1;
        bytes value = 2;
    }
    message Response {
        repeated ReadResult results = 1;
        bool is_aborted = 2;
    }
}

// Flush writes and deletes in the same order MySQL issued them.
message TxBatchWrite {
    message BatchOp {
        BatchOpType type = 1;
        bytes key = 2;
        bytes value = 3;
        string index_name = 4;
        bytes secondary_key = 5;
        bytes primary_key = 6;
        string table_name = 7;
    }
    message Request {
        int64 transaction_id = 1;
        string table_name = 2;
        // Operations are applied in the same order as MySQL issued them.
        repeated BatchOp ops = 3;
    }
    message Response {
        bool success = 1;
        bool is_aborted = 2;
    }
}

// Read a primary-key value without opening a server-side transaction.
// The returned TID is validated later by TxValidateAndCommit.
message TxStatelessRead {
    message Request {
        string table_name = 1;
        bytes key = 2;
    }
    message Response {
        bool found = 1;
        bytes value = 2;
        uint64 tid = 3;
    }
}

// Read multiple primary-key values without opening a server-side transaction.
message TxStatelessBatchRead {
    message ReadOp {
        string table_name = 1;
        bytes key = 2;
    }
    message Request {
        repeated ReadOp ops = 1;
    }
    message ReadResult {
        bool found = 1;
        bytes value = 2;
        uint64 tid = 3;
    }
    message Response {
        repeated ReadResult results = 1;
    }
}

// Scan primary-key rows without opening a server-side transaction.
// Returned row TIDs and the proxy-assembled range read are validated by
// TxValidateAndCommit.
message TxStatelessRangeScan {
    message Request {
        string table_name = 1;
        bytes start_key = 2;
        bytes end_key = 3;
        uint64 row_limit = 4; // 0 means no limit.
        bool reverse_scan = 5;
    }
    message Row {
        bytes key = 1;
        bytes value = 2;
        uint64 tid = 3;
        bool found = 4;
    }
    message Response {
        repeated Row rows = 1;
        bool ok = 2;
    }
}

// Scan secondary-index entries without opening a server-side transaction.
// Base row TIDs and the proxy-assembled range read are validated by
// TxValidateAndCommit.
message TxStatelessSecondaryRangeScan {
    message Request {
        string table_name = 1;
        string index_name = 2;
        bytes start_key = 3;
        bytes end_key = 4;
        uint64 row_limit = 5; // 0 means no limit.
        bool reverse_scan = 6;
    }
    message Row {
        bytes secondary_key = 1;
        bytes primary_key = 2;
        bytes value = 3;
        uint64 tid = 4;
        bool found = 5;
    }
    message Response {
        repeated Row rows = 1;
        bool ok = 2;
    }
}

// Execute a dependent read plan in one RPC.
// Steps may read values produced by earlier steps to build later keys.
message TxExecuteReadPlan {
    message KeyBinding {
        uint32 source_step = 1;
        uint32 source_row = 2;
        uint32 source_offset = 3;
        uint32 source_length = 4; // 0 means the rest of the source bytes.
        bool use_midpoint = 5;
        bool from_key = 6;
        int32 source_column = 7; // 1-based row column; 0 means disabled.
        bool column_as_int_key = 8;
        int64 int_delta = 9;
    }
    message PlanStep {
        string table_name = 1;
        bytes key_prefix = 2;
        bytes end_key_prefix = 3;
        bool is_scan = 4;
        uint64 scan_limit = 5; // 0 means no limit.
        string index_name = 6; // Empty means primary index.
        repeated KeyBinding bindings = 7;
        repeated KeyBinding end_bindings = 8;
        bool for_each = 9;
        bool reverse_scan = 10;
        // Server-side row filter for primary scans (same semantics as the
        // stateless scan RPCs): non-matching rows are dropped from the
        // response; rows the server cannot parse are returned for MySQL to
        // re-evaluate. Only attached when commit-time validation is off
        // (read-only no-validate), since a replay could not reproduce the
        // filtered key set.
        PushedPredicate filter = 11;
        // Projection pushdown: when present, the server returns each base-row
        // VALUE trimmed to only field_indexes (0-based TABLE::field[], ascending,
        // unique), re-emitting [full null_flags][kept columns]. Absent = full
        // row (legacy). The proxy decodes by mapping the k-th present column to
        // field field_indexes[k]. The server still parses the FULL row to
        // evaluate `filter` before trimming.
        RowProjection projection = 12;
        // Phase-8 Phase B: when present, the server aggregates scanned rows and
        // returns group rows (see AggregateSpec) instead of base rows.
        AggregateSpec aggregate = 13;
        // Phase-9 semijoin reduction: when present, the server keeps only rows
        // whose probe_column value is a member of the set of source_column
        // values produced by an EARLIER step (source_step < this step). The
        // join itself stays on the compute side; the server merely avoids
        // shipping rows that cannot join (result-preserving for plain INNER
        // equi-joins; the planner whitelists eligible leaves).
        repeated SemijoinFilter semijoins = 14;
        // Negative-coverage suppression: filtered_keys (the keys of rows a
        // pushed `filter` rejected) exist ONLY so a later point probe into the
        // same table answers not-found locally instead of aborting. When this
        // table is read by no other plan step, those keys are pure dead weight
        // (q14: lineitem ships 593k rejected keys / 9.5MB that nobody reads).
        // Set true to tell the server to drop them. Sound: it can never make a
        // filtered-out row visible. Worst case, if the planner missed a same-
        // table point consumer, that probe becomes a cache-miss prefetch abort
        // (fail-closed, loud) rather than a wrong local not-found. The planner
        // sets it only when this table appears in no other plan step, so no such
        // probe exists.
        bool suppress_filtered_keys = 15;
        // Membership-staging (Phase-18 q22): this step is the inner of an
        // ANTI-JOIN (NOT EXISTS / NOT IN), so the executor only needs to know
        // whether ANY matching inner row EXISTS for each probe key — never the
        // row contents (an anti-join never projects inner columns). The server
        // emits at most ONE row per (deduped) probe key instead of every match,
        // collapsing e.g. q22's 1.5M order rows (100MB) into ~one existence
        // marker per distinct o_custkey (~MB). Result-preserving: for NOT
        // EXISTS only existence matters, so capping at the first match cannot
        // change which outer rows survive. Unlike a scan_limit truncation this
        // carries no "more rows exist" lie — the membership answer is complete,
        // so index_next legitimately reports EOF (no truncation fallback).
        // The planner sets it only for an anti-join nest's inner leaf.
        bool existence_only = 16;
    }
    // Phase-9 semijoin: drop probe rows whose join key is absent from an
    // earlier step's result. Columns are 0-based TABLE::field[] ordinals; the
    // server compares the raw stored bytes of source_column vs probe_column.
    message SemijoinFilter {
        uint32 source_step = 1;    // earlier step whose result supplies the key set
        uint32 source_column = 2;  // column of source rows to collect
        uint32 probe_column = 3;   // column of this step's rows to test
        // Optional predicate on the SOURCE rows: the membership set collects
        // source_column only from source rows satisfying this filter. The source
        // step still ships ALL its rows (it may be a join inner the executor
        // point-probes), but the set is reduced so the probe side is pruned.
        PushedPredicate source_filter = 4;
    }
    // Set of base-row columns the query needs (= the proxy's read_set union
    // across aliases of the same physical table).
    message RowProjection {
        uint32 num_columns = 1;                            // table->s->fields
        repeated uint32 field_indexes = 2 [packed = true]; // kept, ascending/unique
    }
    message StepResult {
        bool found = 1;
        bytes value = 2;
        uint64 tid = 3;
        bytes actual_key = 4;
        repeated bytes scan_keys = 5;
        repeated bytes scan_values = 6;
        repeated uint64 scan_tids = 7;
        repeated bytes secondary_keys = 8;
        bytes actual_start_key = 9;
        bytes actual_end_key = 10;
        // for_each scan probes (FER/FES): the flat arrays above are sliced
        // into per-probe groups. group_sizes[i] rows belong to the probe
        // whose effective bounds are [group_start_keys[i], group_end_keys[i]).
        // Probes are deduplicated by start key on the server.
        repeated uint32 group_sizes = 11;
        repeated bytes group_start_keys = 12;
        repeated bytes group_end_keys = 13;
        // Scan filter pushdown coverage: keys of rows the step filter
        // REJECTED (plain scans only). The proxy registers them as negative
        // row-cache entries so point probes into a filtered scan resolve to
        // not-found locally — sound per alias, because the filter is a
        // conjunct of that alias's WHERE (MySQL would discard the row).
        repeated bytes filtered_keys = 14;
    }
    message Request {
        repeated PlanStep steps = 1;
    }
    message Response {
        repeated StepResult results = 1;
        bool ok = 2;
    }
}

// Validate stateless reads and install buffered writes in one RPC.
message TxValidateAndCommit {
    message ReadEntry {
        string table_name = 1;
        bytes key = 2;
        uint64 tid = 3;
        bool found = 4;
    }
    message WriteEntry {
        string table_name = 1;
        bytes key = 2;
        bytes value = 3;
        bool is_delete = 4;
    }
    message DeleteEntry {
        string table_name = 1;
        bytes key = 2;
    }
    message SecondaryIndexEntry {
        string table_name = 1;
        string index_name = 2;
        bytes secondary_key = 3;
        bytes primary_key = 4;
        bool is_delete = 5;
    }
    message Request {
        repeated ReadEntry reads = 1;
        repeated WriteEntry writes = 2;
        repeated DeleteEntry deletes = 3;
        repeated SecondaryIndexEntry secondary_index_ops = 4;
        repeated TableRowDelta row_deltas = 5;
        bool fence = 6;
        repeated RangeReadEntry range_reads = 7;
    }
    message Response {
        bool committed = 1;
        repeated TableRowCount table_stats = 2;
        string abort_reason = 3;
    }
}

// Read a single value by primary key.
message TxRead {
    message Request {
        int64 transaction_id = 1;
        bytes key = 2;
        string table_name = 4;
    }
    message Response {
        bool found = 1;
        bytes value = 2;
        bool is_aborted = 3;
    }
}

// Write a value by primary key.
message TxWrite {
    message Request {
        int64 transaction_id = 1;
        bytes key = 2;
        bytes value = 3;
        string table_name = 5;
    }
    message Response {
        bool success = 1;
        bool is_aborted = 2;
    }
}

// Wait for all pending transactions to be durably committed.
message DbFence {
    message Request {}
    message Response {}
}

// Row-count delta reported by proxy on commit (piggybacked on EndTransaction).
message TableRowDelta {
    string table_name = 1;
    int64 delta = 2;
}

// Snapshot of a single table's row count, returned by server in BEGIN/END.
message TableRowCount {
    string table_name = 1;
    int64 row_count = 2;
}

// Commit or abort a transaction.
// @param fence  If true, block until the transaction is durably committed.
// @param row_deltas  Row-count changes accumulated during this transaction.
//   Server applies these only on successful commit and returns updated
//   table_stats in the response for the proxy's next transaction.
message DbEndTransaction {
    message Request {
        int64 transaction_id = 1;
        bool fence = 2;
        repeated TableRowDelta row_deltas = 3;
    }
    message Response {
        bool is_aborted = 1;
        repeated TableRowCount table_stats = 2;
    }
}

// Delete a value by primary key.
message TxDelete {
    message Request {
        int64 transaction_id = 1;
        bytes key = 2;
        string table_name = 4;
    }
    message Response {
        bool success = 1;
        bool is_aborted = 2;
    }
}

// Read primary-key values associated with a secondary key.
// @see LineairDBTransaction::read_secondary_index()
message TxReadSecondaryIndex {
    message Request {
        int64 transaction_id = 1;
        string index_name = 2;
        bytes secondary_key = 3;
        string table_name = 4;
    }
    message Response {
        repeated bytes values = 1;
        bool is_aborted = 2;
    }
}

// Write a primary-key entry into a secondary index.
// @see LineairDBTransaction::write_secondary_index()
message TxWriteSecondaryIndex {
    message Request {
        int64 transaction_id = 1;
        string index_name = 2;
        bytes secondary_key = 3;
        bytes primary_key = 4;
        string table_name = 5;
    }
    message Response {
        bool success = 1;
        bool is_aborted = 2;
    }
}

// Remove a primary-key entry from a secondary index.
// @see LineairDBTransaction::delete_secondary_index()
message TxDeleteSecondaryIndex {
    message Request {
        int64 transaction_id = 1;
        string index_name = 2;
        bytes secondary_key = 3;
        bytes primary_key = 4;
        string table_name = 5;
    }
    message Response {
        bool success = 1;
        bool is_aborted = 2;
    }
}

// Atomically move a primary key from one secondary key to another.
// @see LineairDBTransaction::update_secondary_index()
message TxUpdateSecondaryIndex {
    message Request {
        int64 transaction_id = 1;
        string index_name = 2;
        bytes old_secondary_key = 3;
        bytes new_secondary_key = 4;
        bytes primary_key = 5;
        string table_name = 6;
    }
    message Response {
        bool success = 1;
        bool is_aborted = 2;
    }
}

// Create a new table in the database.
// @see LineairDB::Database::CreateTable()
message DbCreateTable {
    message Request {
        string table_name = 1;
    }
    message Response {
        bool success = 1;
    }
}

// Set the table context for a transaction. Subsequent operations
// within this transaction will be scoped to the specified table.
// @see LineairDB::Transaction::SetTable()
message DbSetTable {
    message Request {
        int64 transaction_id = 1;
        string table_name = 2;
    }
    message Response {
        bool success = 1;
    }
}

// Create a secondary index on a table.
// @see LineairDB::Database::CreateSecondaryIndex()
// @param index_type  0=kNone, 2=kDictUnique (LineairDB::Index::SecondaryIndexType)
message DbCreateSecondaryIndex {
    message Request {
        string table_name = 1;
        string index_name = 2;
        uint32 index_type = 3;
    }
    message Response {
        bool success = 1;
    }
}

// Phase-21 Step-3: DROP INDEX purge — remove a secondary index outright.
message DbDropSecondaryIndex {
    message Request {
        string table_name = 1;
        string index_name = 2;
    }
    message Response {
        bool success = 1;
    }
}

// Scan keys in [start_key, end_key) range.
// @see LineairDBTransaction::get_matching_keys_in_range()
message TxGetMatchingKeysInRange {
    message Request {
        int64 transaction_id = 1;
        bytes start_key = 2;
        bytes end_key = 3;
        string table_name = 5;
    }
    message Response {
        repeated bytes keys = 1;
        bool is_aborted = 2;
    }
}

// Scan key-value pairs in [start_key, end_key) range.
// Skips tombstones (null/zero-length values).
// @see LineairDBTransaction::get_matching_keys_and_values_in_range()
message TxGetMatchingKeysAndValuesInRange {
    message Request {
        int64 transaction_id = 1;
        bytes start_key = 2;
        bytes end_key = 3;
        PushedPredicate filter = 5;
        string table_name = 6;
        uint64 row_limit = 7; // 0 means no limit.
        bool reverse_scan = 8; // true means scan in descending key order.
    }
    message Response {
        repeated KeyValue results = 1;
        bool is_aborted = 2;
    }
}

// Scan key-value pairs matching a prefix.
// Skips tombstones (null/zero-length values).
// @see LineairDBTransaction::get_matching_keys_and_values_from_prefix()
message TxGetMatchingKeysAndValuesFromPrefix {
    message Request {
        int64 transaction_id = 1;
        bytes prefix = 2;
        PushedPredicate filter = 3;
        string table_name = 4;
    }
    message Response {
        repeated KeyValue results = 1;
        bool is_aborted = 2;
    }
}

// Reverse scan to find the last key in [start_key, end_key) range.
// @see LineairDBTransaction::fetch_last_key_in_range()
message TxFetchLastKeyInRange {
    message Request {
        int64 transaction_id = 1;
        bytes start_key = 2;
        bytes end_key = 3;
        string table_name = 5;
    }
    message Response {
        bool found = 1;
        bytes key = 2;
        bool is_aborted = 3;
    }
}

// Find the first non-tombstone key in [prefix, prefix_end) range.
// @see LineairDBTransaction::fetch_first_key_with_prefix()
message TxFetchFirstKeyWithPrefix {
    message Request {
        int64 transaction_id = 1;
        bytes prefix = 2;
        bytes prefix_end = 3;
        string table_name = 4;
    }
    message Response {
        bool found = 1;
        bytes key = 2;
        bool is_aborted = 3;
    }
}

// Find the next non-tombstone key after last_key in [last_key, prefix_end) range.
// @see LineairDBTransaction::fetch_next_key_with_prefix()
message TxFetchNextKeyWithPrefix {
    message Request {
        int64 transaction_id = 1;
        bytes last_key = 2;
        bytes prefix_end = 3;
        string table_name = 4;
    }
    message Response {
        bool found = 1;
        bytes key = 2;
        bool is_aborted = 3;
    }
}

// Scan primary keys from a secondary index in [start_key, end_key) range.
// @see LineairDBTransaction::get_matching_primary_keys_in_range()
message TxGetMatchingPrimaryKeysInRange {
    message Request {
        int64 transaction_id = 1;
        string index_name = 2;
        bytes start_key = 3;
        bytes end_key = 4;
        string table_name = 6;
    }
    message Response {
        repeated bytes primary_keys = 1;
        bool is_aborted = 2;
    }
}

// Scan primary keys from a secondary index matching a prefix.
// @see LineairDBTransaction::get_matching_primary_keys_from_prefix()
message TxGetMatchingPrimaryKeysFromPrefix {
    message Request {
        int64 transaction_id = 1;
        string index_name = 2;
        bytes prefix = 3;
        string table_name = 4;
    }
    message Response {
        repeated bytes primary_keys = 1;
        bool is_aborted = 2;
    }
}

// Reverse scan to find the last primary key in a secondary index range
// [start_key, end_key).
// @see LineairDBTransaction::fetch_last_primary_key_in_secondary_range()
message TxFetchLastPrimaryKeyInSecondaryRange {
    message Request {
        int64 transaction_id = 1;
        string index_name = 2;
        bytes start_key = 3;
        bytes end_key = 4;
        string table_name = 6;
    }
    message Response {
        bool found = 1;
        bytes primary_key = 2;
        bool is_aborted = 3;
    }
}

// Reverse scan to find the last secondary index entry (secondary key + primary keys)
// in [start_key, end_key) range.
// @see LineairDBTransaction::fetch_last_secondary_entry_in_range()
message TxFetchLastSecondaryEntryInRange {
    message Request {
        int64 transaction_id = 1;
        string index_name = 2;
        bytes start_key = 3;
        bytes end_key = 4;
        string table_name = 6;
    }
    message Response {
        bool found = 1;
        SecondaryIndexEntry entry = 2;
        bool is_aborted = 3;
    }
}

// Predicate pushdown: recursive expression tree for server-side row filtering.
// Server evaluates this during Scan and skips non-matching rows.
// MySQL still re-evaluates all conditions (cond_push returns original cond).
message FilterExpr {
    enum Op {
        CONST_INT = 0; CONST_UINT = 1; CONST_DOUBLE = 2;
        CONST_STRING = 3; CONST_NULL = 4; COLUMN_REF = 5;
        OP_EQ = 10; OP_NE = 11; OP_LT = 12; OP_LE = 13;
        OP_GT = 14; OP_GE = 15;
        OP_AND = 20; OP_OR = 21; OP_NOT = 22;
        OP_BETWEEN = 30; OP_IN = 31; OP_LIKE = 32;
        OP_IS_NULL = 33; OP_IS_NOT_NULL = 34;
        // Arithmetic (Phase-8 Phase B aggregate-argument expressions). Evaluated
        // server-side in exact (mantissa,scale) integer form for decimals.
        OP_ADD = 40; OP_SUB = 41; OP_MUL = 42; OP_DIV = 43; OP_NEG = 44;
    }
    Op op = 1;
    int64 int_val = 2;
    uint64 uint_val = 3;
    double double_val = 4;
    bytes string_val = 5;
    uint32 column_index = 6;  // 0-based (COLUMN_REF用)
    uint32 compare_type = 7;  // 0=SIGNED_INT, 1=UNSIGNED_INT, 2=DOUBLE, 3=STRING
    repeated FilterExpr children = 8;
    bool negated = 9;         // BETWEEN, IN用
}

message PushedPredicate {
    FilterExpr expr = 1;
    uint32 num_columns = 2;
}

// Phase-8 Phase B: aggregation pushdown. When attached to an is_scan PlanStep,
// the server GROUP-BYs the scanned (post-filter) rows by `group_columns` and
// computes `aggs`, returning ONE synthetic group row per group via the step's
// scan_values (NOT the raw base rows). Each group row reuses the standard row
// format [null_flags][cols...]: first the group-key columns (raw stored bytes,
// in group_columns order), then 2 columns per aggregate — (value, count):
//   COUNT: value=row count (count col unused)
//   SUM:   value=exact decimal sum as ASCII (null/empty if 0 non-null), count=non-null count
//   AVG:   value=exact decimal sum as ASCII, count=non-null count (proxy divides)
// The proxy decodes positionally (it built the spec) and emits via Item_cache.
// Single server + single scan ⇒ groups are FINAL (no cross-node merge needed).
message AggFunc {
    enum Kind { AGG_COUNT = 0; AGG_SUM = 1; AGG_AVG = 2; }
    Kind kind = 1;
    FilterExpr arg = 2;        // argument expression (absent for COUNT(*))
    uint32 result_scale = 3;   // decimal scale of the per-row arg value
}
message AggregateSpec {
    uint32 num_columns = 1;                            // table->s->fields (row parse)
    repeated uint32 group_columns = 2 [packed = true]; // 0-based field indices (GROUP BY)
    repeated AggFunc aggs = 3;
    // Server-side HAVING (Phase-16): drop groups failing
    //   aggs[having_agg_index] <op> having_const   at emission, so only
    // passing groups ship (q18: 1.5M groups -> ~57). SUM/COUNT aggregates
    // only (AVG needs div_precincrement semantics; the proxy filters those).
    // having_op: 0=none 1:'>' 2:'>=' 3:'<' 4:'<=' 5:'=' 6:'!='
    uint32 having_op = 4;
    uint32 having_agg_index = 5;
    string having_const = 6;                           // ASCII decimal
}
